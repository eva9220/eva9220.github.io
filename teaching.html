  document.getElementById("cls").innerHTML='<button class="all'+(cc<0?' on':'')+'" data-c="-1" style="--c:#f6992a">全部班級</button>'+C.map(function(k,j){return '<button class="'+(cc==j?'on':'')+'" data-c="'+j+'" style="--c:'+k.c+'">'+k.n+'</button>'}).join("");
  var g="";
  for(var i=0;i<p.items.length;i++){
    var t=p.items[i],n=BASE[cur]+i;
    g+='<button class="t'+(i==sel?' on':'')+'" data-k="'+i+'"><small>第'+N[n]+'主題</small><b>'+esc(t.zh)+'</b><em>'+esc(t.en)+'</em><span class="chip">'+t.m+'月</span></button>';
  }
  document.getElementById("grid").innerHTML=g;
  var d=document.getElementById("detail"),t=p.items[sel];
  if(t){d.hidden=false;d.innerHTML='<h3>第'+N[BASE[cur]+sel]+'主題|'+esc(t.zh)+' '+esc(t.en)+'</h3><dl><dt>英文兒歌</dt><dd>'+esc(t.es)+'</dd><dt>中文兒歌</dt><dd>'+esc(t.cs)+'</dd><dt>英文延伸</dt><dd>'+esc(t.ew)+'</dd><dt>中文延伸</dt><dd>'+esc(t.cw)+'</dd></dl>'+weeks(t)}else d.hidden=true;
}
document.addEventListener("input",function(e){var el=e.target;if(el.dataset&&el.dataset.ak){var o=ACT[el.dataset.ak]=ACT[el.dataset.ak]||{};o[el.dataset.f]=el.value;saveACT()}});
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-i]");if(b){cur=+b.dataset.i;sel=-1;wk=0;render();return}
  if(e.target.id=="pk"){closePk();return}
  var pi=e.target.closest("[data-pick]");if(pi&&PK){OV[PK.k]=pi.dataset.pick;saveOV();closePk();render();return}
  var pq=e.target.closest("[data-pkx]");if(pq){if(pq.dataset.pkx=="dreset"&&PK){delete DOV[PK.k];delete OV[PK.k];saveDOV();saveOV();render()}if(pq.dataset.pkx=="reset"&&PK){delete OV[PK.k];saveOV();render()}closePk();return}
  var dkb=e.target.closest("[data-dk]");if(dkb){openDk(dkb.dataset.dk);return}
  var dp=e.target.closest("[data-dpick]");if(dp&&PK){var n=+dp.dataset.dpick;if(n==DOM[PK.i])delete DOV[PK.k];else DOV[PK.k]=n;delete OV[PK.k];saveDOV();saveOV();closePk();render();return}
  var fb=e.target.closest("[data-fill]");if(fb){var a=fb.dataset.fill.split("-"),th=O.filter(function(x){return x.m==+a[0]})[0],g=G(th,+a[1],+a[2],+a[3]),o=ACT[fb.dataset.fill]=ACT[fb.dataset.fill]||{};if(!o.t)o.t=g.tit;if(!o.c)o.c=g.txt;if(!o.r)o.r=g.res.join("、");saveACT();render();return}
  var ik=e.target.closest("[data-ik]");if(ik){openPk(ik.dataset.ik);return}
  var px=e.target.closest("[data-x]");if(px){if(px.dataset.x=="print")window.print();else document.getElementById("pr").className="";return}
  var pb=e.target.closest("[data-p]");if(pb){printTable(+pb.dataset.p);return}
  var wb=e.target.closest("[data-w]");if(wb){wk=+wb.dataset.w;render();return}
  var q=e.target.closest("[data-c]");if(q){cc=+q.dataset.c;render();return}
  var k=e.target.closest("[data-k]");if(k){var n=+k.dataset.k;sel=(sel==n?-1:n);wk=0;render();if(sel>=0)document.getElementById("detail").scrollIntoView({behavior:"smooth"})}
});
render();
</script>
</body>
</html>
