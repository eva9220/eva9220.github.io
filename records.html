(function(){try{var E=JSON.parse(localStorage.getItem("ccEdits"))||{};Object.keys(E.c||{}).forEach(function(k){var p=k.split("|"),w=(window.CUR||{})[p[0]],r=w&&w[p[1]]&&w[p[1]][+p[2]];if(r){r[0]=E.c[k].t;r[2]=E.c[k].x;r[3]=E.c[k].r}});Object.keys(E.theme||{}).forEach(function(m){window.THEME[m]=E.theme[m]})}catch(e){}})();
var $=function(i){return document.getElementById(i)},TH=window.THEME||{};
function ld(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var T=ld("staffRoster",["陳巧芳","吳婉寧","梁欣萍","徐華家","柯楷倫","周香瑩","蔡季涵","杜雯捷","鄭亞柔","林筠蓉","陳珮如"]),K=ld("ccKids",[]),ST={t:"",k:null,all:false,mo:""};
function pd(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function iso(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function mon(b,d){var x=pd(b);var n=(d.getFullYear()-x.getFullYear())*12+d.getMonth()-x.getMonth()-(d.getDate()<x.getDate()?1:0);return Math.max(0,n)}
function cls(m){return m<=6?"嫩芽班":m<=18?"花曦班":"晴空班"}
function rend(){
 $("tg").className="grid"+(document.body.classList.contains("edit")?"":"");
 $("tg").innerHTML=T.map(function(n,i){return'<button class="c'+(n===ST.t?' on':'')+'" data-t="'+i+'"><span class="x" data-dt="'+i+'">✕</span><div class="av">'+n.slice(-1)+'</div><b>'+n+'</b></button>'}).join("")+'<button class="c add" id="at">＋<small>新增人員</small></button>';
 $("kt").textContent="🧒 幼兒名冊"+(ST.t&&!ST.all?"　"+ST.t:"　全部幼兒");
 var list=K.map(function(k,i){k.i=i;return k}).filter(function(k){return ST.all||!ST.t||k.t===ST.t});
 var now=new Date();
 $("kg").innerHTML=list.map(function(k){var m=mon(k.b,now);return'<button class="c'+(ST.k===k.i?' on':'')+'" data-k="'+k.i+'"><span class="x" data-dk="'+k.i+'">✕</span><div class="av">'+k.n.slice(0,1)+'</div><b>'+k.n+'</b><small>'+m+' 個月・'+cls(m).replace("班","")+'</small></button>'}).join("")+'<button class="c add" id="ak">＋<small>新增幼兒</small></button>';
 $("kh").textContent=!ST.t?"請先點選托育人員。":(list.length?"":"這位托育人員還沒有幼兒，請按「新增幼兒」，或按「看全部幼兒」。");
 var kid=ST.k!=null?K[ST.k]:null;$("wt").textContent=kid?"📅 "+kid.n+" 的週記錄":"📅 週記錄";
 var ms=Object.keys(TH);if(!$("mo").options.length)$("mo").innerHTML=ms.map(function(m){var p=m.split("-");return'<option value="'+m+'">'+(+p[0]-1911)+'年'+(+p[1])+'月　'+TH[m]+'</option>'}).join("");
 if(!ST.mo){var cm=iso(now).slice(0,7);ST.mo=ms.indexOf(cm)>-1?cm:ms[0]}$("mo").value=ST.mo;
 var out="",d=pd(ST.mo+"-01");while(d.getDay()!==1)d.setDate(d.getDate()-1);while(iso(new Date(d.getFullYear(),d.getMonth(),d.getDate()+3)).slice(0,7)<ST.mo)d.setDate(d.getDate()+7);
 var n=0,td=iso(now);
 while(iso(new Date(d.getFullYear(),d.getMonth(),d.getDate()+3)).slice(0,7)===ST.mo){n++;var f=new Date(d);f.setDate(d.getDate()+4);var a=iso(d),b=iso(f),cur=(td>=a&&td<=iso(new Date(d.getFullYear(),d.getMonth(),d.getDate()+6)));
  var st="";if(kid){var o=ld("actRec:"+kid.n+":"+a,null),fl=o&&(Object.keys(o.p||{}).length||o.s||Object.keys(o.f||{}).some(function(x){return/^t\d|^ref$|^fb$/.test(x)&&o.f[x]}));st=fl?'<div class="st ok">● 已填寫</div>':'<div class="st no">● 未填寫</div>'}
  out+='<button class="c w" data-w="'+a+'|'+b+'">'+(cur?'<span class="now">本週</span>':'')+'<small>第 '+n+' 週</small><b>'+a.slice(5).replace("-","/")+'~'+b.slice(5).replace("-","/")+'</b><small>'+(TH[ST.mo]||"")+'</small>'+st+'</button>';
  d.setDate(d.getDate()+7)}
 $("wg").innerHTML=out;
}
document.body.onclick=function(e){var t=e.target,c=t.closest("[data-dt],[data-dk],[data-t],[data-k],[data-w],#at,#ak");
 if(t.id==="ed"){document.body.classList.toggle("edit");document.querySelectorAll(".x").forEach(function(x){x.style.display=document.body.classList.contains("edit")?"block":"none"});return}
 if(t.id==="all"){ST.all=!ST.all;$("all").textContent=ST.all?"只看我的幼兒":"看全部幼兒";rend();return}
 if(t.id==="ta"){var v=$("tn").value.trim();if(v&&T.indexOf(v)<0){T.push(v);sv("staffRoster",T);ST.t=v}$("tn").value="";$("ft").classList.remove("show");rend();return}
 if(t.id==="ka"){var nm=$("kn").value.trim(),b=$("kb").value;if(!nm||!b){alert("請輸入姓名與出生日期");return}K.push({n:nm,b:b,t:ST.t});sv("ccKids",K);ST.k=K.length-1;$("kn").value=$("kb").value="";$("fk").classList.remove("show");rend();return}
 if(!c)return;
 if(c.id==="at"){$("ft").classList.add("show");$("tn").focus();return}
 if(c.id==="ak"){if(!ST.t){alert("請先點選托育人員");return}$("fk").classList.add("show");$("kn").focus();return}
 if(c.dataset.dt!==undefined){e.stopPropagation();if(confirm("要把「"+T[+c.dataset.dt]+"」從名單移除嗎？")){T.splice(+c.dataset.dt,1);sv("staffRoster",T);ST.t="";rend()}return}
 if(c.dataset.dk!==undefined){e.stopPropagation();var kk=K[+c.dataset.dk];if(confirm("要把「"+kk.n+"」從名冊移除嗎？")){K.splice(+c.dataset.dk,1);sv("ccKids",K);ST.k=null;rend()}return}
 if(c.dataset.t!==undefined){ST.t=T[+c.dataset.t];ST.k=null;rend();return}
 if(c.dataset.k!==undefined){ST.k=+c.dataset.k;rend();$("wt").scrollIntoView({behavior:"smooth"});return}
 if(c.dataset.w!==undefined){if(ST.k==null){alert("請先點選幼兒");return}var kid=K[ST.k],w=c.dataset.w.split("|"),m=mon(kid.b,pd(w[0])),q=new URLSearchParams({kid:kid.n,cls:cls(m),tch:ST.t,d1:w[0],d2:w[1],m:m});location.href="activity-record.html?"+q.toString()}};
$("mo").onchange=function(){ST.mo=this.value;rend()};
rend();
</script>
</body>
</html>
