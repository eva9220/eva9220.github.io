<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>參觀預約登記｜初晴之森托嬰中心</title>
<style>
:root{--g:#57704f;--g2:#6f8667;--gl:#f3f5ef;--ln:#c9d1c3;--ink:#3f4a3b;--y:#ecc56b;--cream:#fbf8f1}
*{box-sizing:border-box}
body{margin:0;background:#efeae0;color:var(--ink);font:16px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding-bottom:40px}
.bar{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;background:#f3e6c2;border-bottom:3px solid #d8c48c}
.bar a,.bar button{font:inherit;font-size:14px;color:#4d4a47;text-decoration:none;border:2px solid #4d4a47;border-radius:99px;padding:4px 14px;background:#fff}
.bar b{font-size:18px;letter-spacing:.08em;flex:1}
.bar button{background:var(--g);border-color:var(--g);color:#fff}
.hint{text-align:center;color:#8a7d68;font-size:13px;margin:10px 12px 0}
.wrap{overflow-x:auto;padding:14px 10px}
/* A4 紙張 */
.sheet{width:210mm;min-height:297mm;margin:0 auto;background:var(--cream);box-shadow:0 4px 18px rgba(0,0,0,.12);display:flex;flex-direction:column;overflow:hidden}
.hd{flex-shrink:0;position:relative;background:var(--g);color:#fff;padding:5mm 10mm 5mm;display:flex;align-items:center;gap:6mm;overflow:hidden}
.hd:before{content:"";position:absolute;right:16mm;top:-20mm;width:40mm;height:40mm;border-radius:50%;background:rgba(236,197,107,.22)}
.hd:after{content:"";position:absolute;right:24mm;top:-14mm;width:24mm;height:24mm;border-radius:50%;background:rgba(236,197,107,.55)}
.hd .wave{position:absolute;left:0;right:0;bottom:0;height:5mm;width:100%}
.org small{display:block;font-size:9.5pt;letter-spacing:.3em;opacity:.85}
.org h1{margin:0;font:700 19pt/1.2 "Noto Serif TC","Songti TC","PMingLiU",serif;letter-spacing:.06em}
.pill{position:relative;z-index:1;background:var(--y);color:#3f4a3b;font-weight:700;font-size:13pt;letter-spacing:.12em;border-radius:99px;padding:2mm 6mm;white-space:nowrap}
.meta{position:relative;z-index:1;margin-left:auto;font-size:11pt;white-space:nowrap;align-self:flex-end}
.meta i{display:inline-block;border-bottom:1px solid #fff;width:13mm;margin:0 1mm}
.meta i.s{width:9mm}
.body{padding:4mm 8mm 3mm;flex:1 1 0;min-height:0;display:flex;flex-direction:column}
table{width:100%;flex:1;border-collapse:collapse;table-layout:fixed;background:#fff}
th{background:var(--g);color:#fff;font-size:11.5pt;font-weight:700;padding:2.2mm 1mm;line-height:1.3;border-left:1px solid var(--g2)}
th:first-child{border-left:0}
td{border:1px solid var(--ln);vertical-align:middle;padding:0;font-size:11pt;height:15mm}
tbody tr:nth-child(even) td{background:var(--gl)}
td.n{text-align:center;color:#55604f;font-size:12pt}
.dt{display:flex;flex-direction:column;justify-content:space-around;height:100%;padding:1mm 2mm;color:#55604f;font-size:10.5pt}
.dt .ymd{text-align:right;letter-spacing:0;word-spacing:3.2mm}
.ck{display:inline-flex;align-items:center;gap:.8mm;white-space:nowrap}
.ck:before{content:"";width:2.8mm;height:2.8mm;border:1px solid #55604f;border-radius:.6mm;background:#fff}
.cls{display:flex;flex-direction:column;justify-content:center;gap:.3mm;padding:0 3mm;line-height:1.15;font-size:9.5pt;color:#55604f;height:100%}
.cls .ck span{font-size:7pt;color:#8a9284}
td.nt{position:relative}td.nt:after{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid var(--ln)}
.ft{flex-shrink:0;display:flex;justify-content:space-between;align-items:center;background:#e4e8df;padding:4mm 10mm;font-size:10pt;font-weight:700;color:var(--ink)}
.ft span{font-weight:400}
.ft i{display:inline-block;width:32mm;border-bottom:1px solid var(--ink);margin-left:2mm}

.bar input[type=month]{font:inherit;font-size:14px;border:2px solid #4d4a47;border-radius:99px;padding:2px 10px;background:#fff}
#st{font-size:12px;color:#57704f;min-width:48px}
.tools{text-align:center;margin:4px 0 0}
.tools button{font:inherit;font-size:14px;border:2px solid var(--g);color:var(--g);background:#fff;border-radius:99px;padding:4px 14px;margin:4px}
.sheet+.sheet{margin-top:14px}
td input,td textarea{font:inherit;color:var(--ink);border:0;background:transparent;outline:0;padding:0;margin:0}
td input:focus,td textarea:focus{background:#fff8dc}
td input.f{width:100%;height:100%;min-height:10mm;padding:0 1.5mm;font-size:12pt;text-align:center}
.dt .ymd{display:flex;justify-content:center;align-items:baseline;gap:.5mm;word-spacing:0;font-size:10pt}
.dt .ymd input{width:6.5mm;min-width:0;text-align:center;font-size:11pt;border-bottom:1px dotted #b9c2b2}
.dt .ymd input.y{width:9mm}
.dt label,.cls label{display:inline-flex;align-items:center;gap:.8mm;white-space:nowrap;cursor:pointer}
.dt input[type=checkbox],.cls input[type=checkbox]{appearance:none;-webkit-appearance:none;width:3.6mm;height:3.6mm;border:1px solid #55604f;border-radius:.6mm;background:#fff;position:relative;flex:none}
.dt input[type=checkbox]:checked:after,.cls input[type=checkbox]:checked:after{content:"✓";position:absolute;left:0;right:0;top:-1.3mm;text-align:center;font-size:9pt;font-weight:700;color:#3f4a3b}
td.nt{padding:0}
td.nt input{display:block;width:100%;height:50%;min-height:5mm;padding:0 2mm;font-size:11pt}
.meta b{display:inline-block;min-width:11mm;text-align:center;border-bottom:1px solid #fff;margin:0 1mm;font-weight:400}
.ft input{font:inherit;font-weight:400;width:32mm;border:0;border-bottom:1px solid var(--ink);background:transparent;outline:0;margin-left:2mm;color:var(--ink)}
@media print{.tools{display:none!important}.sheet+.sheet{margin-top:0;break-before:page}td input:focus{background:transparent}.bar{display:none!important}}
@media print{
  @page{size:A4 portrait;margin:0}
  html,body{background:#fff!important;padding:0!important;margin:0!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bar,.hint{display:none!important}
  .wrap{padding:0;overflow:visible}
  .sheet{box-shadow:none;width:210mm;height:296mm;min-height:0;margin:0;break-inside:avoid;zoom:1!important}
  td{height:auto}
  .body{padding:0}table{border-left:0;border-right:0}tbody td:first-child{border-left:0}tbody td:last-child{border-right:0}
}

/* 每位兩行：格子左上角小標題 */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}td .lb{overflow:hidden;display:block;font-size:7.5pt;color:#8a9284;padding:.8mm 1.8mm 0;line-height:1.1;white-space:nowrap}
tbody tr.a td{border-top:1.6px solid var(--g2)}
tbody tr td{background:#fff!important;height:12.5mm;vertical-align:top}tbody td.n{vertical-align:middle}
tbody tr.z td{background:#fff!important}
td.n{font-size:13pt!important;font-weight:700}
td input.f{display:block;width:100%;height:auto;min-height:7mm;padding:0 2mm;font-size:12pt;text-align:left}
td .ymd{display:flex;align-items:baseline;gap:.6mm;padding:0 2mm;font-size:10.5pt;color:#55604f;white-space:nowrap}
td .ymd input{width:7mm;min-width:0;text-align:center;font-size:11.5pt;border-bottom:1px dotted #b9c2b2}
td .ymd input.y{width:10mm}td .ymd input.tm{width:13mm;margin-left:.5mm}
td .ymd label{margin-left:2mm;font-size:9.5pt}
td .cls{flex-direction:row!important;justify-content:flex-start!important;gap:1.5mm!important;padding:1mm 1.5mm 0!important;font-size:9.5pt!important;height:auto!important}
td .ymd input[type=checkbox]{appearance:none;-webkit-appearance:none;width:3.6mm;height:3.6mm;border:1px solid #55604f;border-radius:.6mm;background:#fff;position:relative;flex:none}
td .ymd input[type=checkbox]:checked:after{content:"✓";position:absolute;left:0;right:0;top:-1.3mm;text-align:center;font-size:9pt;font-weight:700;color:#3f4a3b}

.bar{flex-wrap:wrap}.bar b{white-space:nowrap;flex:1 0 auto}.bar input[type=month]{width:9.5em}
.qk{max-width:560px;margin:12px auto 0;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 3px 0 #d8c48c}
.qk h3{margin:0 0 8px;font-size:17px;color:var(--g)}
.qk .g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}.qk input[type=date],.qk input[type=time]{-webkit-appearance:none;appearance:none;min-height:36px}
.qk label{display:flex;flex-direction:column;font-size:12px;color:#7a8473;gap:2px}
.qk input:not([type=checkbox]):not([type=radio]){font:inherit;font-size:15px;color:var(--ink);border:1.5px solid var(--ln);border-radius:10px;padding:6px 8px;background:#fbfcf9;min-width:0;width:100%}
.qk label.ck2{flex-direction:row;align-items:center;gap:6px;font-size:14px;color:var(--ink);align-self:end;padding-bottom:6px}
.qk .rw{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:#7a8473}
.qk .chip{flex-direction:row;align-items:center;gap:4px;border:1.5px solid var(--ln);border-radius:99px;padding:4px 10px;font-size:14px;color:var(--ink);cursor:pointer}
.qk .full{margin-top:8px}
#q_ok{font:inherit;font-size:16px;border:0;border-radius:99px;padding:8px 26px;background:var(--g);color:#fff;cursor:pointer}
#q_msg{color:var(--g);font-size:14px}
@media print{.qk{display:none!important}.sheet{zoom:1!important}}

.cards{display:none}
@media screen and (max-width:820px){
 .sheet{display:none!important}
 .cards{display:block;max-width:560px;margin:0 auto}
 .vc{background:#fff;border-radius:16px;padding:10px 12px;margin:0 0 12px;box-shadow:0 2px 0 var(--ln)}
 .vh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px dashed var(--ln);padding-bottom:4px;margin-bottom:6px}.vh b{color:var(--g);font-size:16px}.vh span{font-size:12px;color:#8a9284}
 .vg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 10px}
 .vg label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:#7a8473;min-width:0}
 .vg .w2{grid-column:1/-1}
 .vg input.t{font:inherit;font-size:15px;color:var(--ink);border:0;border-bottom:1.5px solid var(--ln);padding:3px 2px;background:transparent;width:100%;outline:0}
 .vg .ymd{display:flex;align-items:baseline;gap:2px;font-size:14px;color:var(--ink);flex-wrap:wrap}
 .vg .ymd input{width:2.2em;font:inherit;font-size:15px;text-align:center;border:0;border-bottom:1.5px solid var(--ln);background:transparent;outline:0;padding:2px 0}
 .vg .ymd input.y{width:2.8em}.vg .ymd input.tm{width:3.6em;margin-left:6px}
 .vg .ck3{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--ink)}
 .vg label label{flex-direction:row;align-items:center;gap:4px;font-size:14px;color:var(--ink)}
 .vg input[type=checkbox]{width:18px;height:18px;accent-color:var(--g)}
}
@media print{.cards{display:none!important}}

.agx{display:flex;flex-direction:column;padding:.3mm 2mm 0;font-size:9pt;line-height:1.3;color:#55604f}.agx.sm{font-size:8.5pt;white-space:nowrap;line-height:1.35}.agx b{color:var(--ink);font-weight:700}
.vg .agx{padding:2px 0;font-size:14px;line-height:1.5}
</style>
</head>
<body>
<div class="bar"><a href="guide.html">← 入園指南</a><b>參觀預約登記</b><input type="month" id="mo"><span id="st"></span><button type="button" onclick="vprint()">🖨️ 列印</button></div>
<p class="hint">直接點格子輸入，會自動儲存。選月份切換不同月的登記表；每 10 位一頁（A4 直式，每位兩行）。</p>
<div class="wrap" id="wrap"></div><div class="tools"><button type="button" id="add">＋ 新增一頁（10 列）</button><button type="button" id="del">－ 刪除最後一頁</button></div>
<script type="text/plain" data-app>
(function(){
var $=function(i){return document.getElementById(i)},mo=$("mo"),now=new Date();
mo.value=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
var QS=new URLSearchParams(location.search);if(/^\d{4}-\d{2}$/.test(QS.get("mo")||""))mo.value=QS.get("mo");
// 在首頁（index.html）的框架裡列印會被切掉，改開單獨的登記表頁面再列印
window.vprint=function(){var was=dirty;flush();if(window.top!==window){try{var u=new URL("visit.html?print=1&mo="+mo.value,window.top.location.href).href;$("st").textContent=was?"儲存中，馬上開啟列印頁…":"開啟列印頁…";setTimeout(function(){window.top.location.href=u},was?2500:300);return}catch(e){}}unfit();window.print()};
if(QS.get("print")==="1")setTimeout(function(){unfit();window.print()},900);
var PER=10,F=["p","ph","c","by","bm","bd","due","ey","em","ed","k1","k2","k3","ag","n1","n2"],D;
function key(){return "visit:"+mo.value}
function load(){try{D=JSON.parse(KV.getItem(key())||"null")}catch(e){D=null}if(!D||!D.rows)D={rows:[],who:""};var n=Math.max(PER,Math.ceil(D.rows.length/PER)*PER);while(D.rows.length<n)D.rows.push({});render()}
var tm,dirty=false;function flush(){if(!dirty)return;clearTimeout(tm);dirty=false;KV.setItem(key(),JSON.stringify({rows:D.rows,who:D.who}));$("st").textContent="✓ 已儲存";months()}
function save(){$("st").textContent="儲存中…";dirty=true;clearTimeout(tm);tm=setTimeout(flush,400)}
window.addEventListener("pagehide",flush);
function E(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function ti(i,f,c,ph){return '<input class="'+(c||"")+'" data-i="'+i+'" data-f="'+f+'" value="'+E(D.rows[i][f])+'"'+(ph?' inputmode="numeric"':'')+'>'}
function cb(i,f,t){return '<label><input type="checkbox" data-i="'+i+'" data-f="'+f+'"'+(D.rows[i][f]?" checked":"")+'>'+t+'</label>'}
function render(){var ym=mo.value.split("-"),pages=Math.ceil(D.rows.length/PER),h="",chg=false;D.rows.forEach(function(r,i){if(auto(i))chg=true});if(chg)save();
for(var pg=0;pg<pages;pg++){var r="";for(var j=0;j<PER;j++){var i=pg*PER+j;
var R0=D.rows[i];if(R0.n2){R0.n1=((R0.n1||"")+" "+R0.n2).trim();delete R0.n2}var z=j%2?' class="z"':'',L=function(t){return'<span class="lb">'+t+'</span>'};
r+='<tr'+(j%2?' class="z a"':' class="a"')+'><td class="n" rowspan="2">'+(i+1)+'</td><td>'+L("家長姓名")+ti(i,"p","f")+'</td><td>'+L("聯絡電話")+ti(i,"ph","f",1)+'</td><td>'+L("參觀日期／時間")+'<div class="ymd">'+ti(i,"vm","",1)+'月'+ti(i,"vd","",1)+'日 '+ti(i,"vt","tm")+'</div></td><td>'+L("孩子姓名")+ti(i,"c","f")+'</td><td>'+L("出生日／預產期")+'<div class="ymd">'+ti(i,"by","y",1)+'年'+ti(i,"bm","",1)+'月'+ti(i,"bd","",1)+'日 '+cb(i,"due","預產期")+'</div></td></tr>'+
'<tr'+(j%2?' class="z b"':' class="b"')+'><td>'+L("預計就讀日期")+'<div class="ymd">'+ti(i,"ey","y",1)+'年'+ti(i,"em","",1)+'月'+ti(i,"ed","",1)+'日</div></td><td>'+L("班別")+'<div class="cls">'+cb(i,"k1","嫩芽")+cb(i,"k2","花曦")+cb(i,"k3","晴空")+'</div></td><td>'+L("年紀")+(agHtml(i,1)||ti(i,"ag","f"))+'</td><td>'+L("目前有無入托")+'<div class="cls">'+cb(i,"t1","有")+cb(i,"t2","無")+'</div></td><td>'+L("備註（家長參觀感受）")+ti(i,"n1","f")+'</td></tr>'}
h+='<div class="sheet"><div class="hd"><div class="org"><small>臺南市私立</small><h1>初晴之森托嬰中心</h1></div><div class="pill">家長預約登記表</div><div class="meta"><b>'+ym[0]+'</b>年<b>'+(+ym[1])+'</b>月　第<b>'+(pg+1)+'</b>頁</div>'+WAVE+'</div><div class="body"><table>'+COLS+'<tbody>'+r+'</tbody></table></div></div>'}
$("wrap").innerHTML=h+cardsHtml();months();$("del").style.display=pages>1?"":"none"}

// 手機畫面：每位家長一張卡片（列印時仍用 A4 表格）
function cardsHtml(){var out="",n=0;D.rows.forEach(function(r,i){if(!r||!(r.p||r.ph||r.c||r.n1))return;n++;
 out+='<div class="vc"><div class="vh"><b>第 '+(i+1)+' 位</b><span>第 '+(Math.floor(i/PER)+1)+' 頁</span></div><div class="vg">'+
 '<label>家長姓名'+ti(i,"p","t")+'</label><label>聯絡電話'+ti(i,"ph","t",1)+'</label>'+
 '<label>參觀日期／時間<span class="ymd">'+ti(i,"vm","",1)+'月'+ti(i,"vd","",1)+'日'+ti(i,"vt","tm")+'</span></label><label>孩子姓名'+ti(i,"c","t")+'</label>'+
 '<label>出生日／預產期<span class="ymd">'+ti(i,"by","y",1)+'年'+ti(i,"bm","",1)+'月'+ti(i,"bd","",1)+'日</span>'+cb(i,"due","預產期")+'</label><label>預計就讀日期<span class="ymd">'+ti(i,"ey","y",1)+'年'+ti(i,"em","",1)+'月'+ti(i,"ed","",1)+'日</span></label>'+
 '<label>年紀'+(agHtml(i)||ti(i,"ag","t"))+'</label><label>目前有無入托<span class="ck3">'+cb(i,"t1","有")+cb(i,"t2","無")+'</span></label>'+
 '<label class="w2">班別<span class="ck3">'+cb(i,"k1","嫩芽班")+cb(i,"k2","花曦班")+cb(i,"k3","晴空班")+'</span></label>'+
 '<label class="w2">備註（家長參觀感受）'+ti(i,"n1","t")+'</label></div></div>'});
 return'<div class="cards">'+(out||'<p class="hint">這個月還沒有登記資料，用上面的「快速登記」新增。</p>')+'</div>'}

// ===== 年齡（依今天實際天數）與預計就讀時的月齡、班級 =====
var CLS=[["嫩芽班",0,11,"k1"],["花曦班",12,20,"k2"],["晴空班",21,36,"k3"]];
try{var C0=JSON.parse(KV.getItem("visit:classes")||"null");if(C0&&C0.length===3&&!(C0[2][1]==21&&C0[2][2]==99))C0.forEach(function(c,k){CLS[k][1]=+c[1];CLS[k][2]=+c[2]})}catch(e){}
function ad(y,m,d){y=+y;m=+m;d=+d;if(!y||!m||!d)return null;if(y<1000)y+=1911;return new Date(y,m-1,d)}
function today0(){var t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())}
function diff(a,b){if(!a||!b||b<a)return null;var m=(b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth();if(b.getDate()<a.getDate())m--;var x=new Date(a.getFullYear(),a.getMonth()+m,a.getDate());return{m:m,d:Math.round((b-x)/864e5)}}
function ageTxt(o){if(!o)return"";var y=Math.floor(o.m/12),m=o.m%12;return(y?y+"歲":"")+(m||!y?m+"個月":"")+(o.d?o.d+"天":"")}
function clsOf(m){for(var k=0;k<CLS.length;k++)if(m>=CLS[k][1]&&m<=CLS[k][2])return CLS[k];return null}
function info(r){var b=ad(r.by,r.bm,r.bd);if(!b)return null;var t=today0(),e=ad(r.ey,r.em,r.ed),o={};
 o.now=b>t?"未出生（還有 "+Math.round((b-t)/864e5)+" 天）":ageTxt(diff(b,t))||"0天";
 if(e){var de=diff(b,e);o.enr=de?ageTxt(de)||"0天":"未出生";o.cls=de?clsOf(de.m):null}return o}
function agHtml(i,sm){var o=info(D.rows[i]);if(!o)return null;var nw=sm?o.now.replace(/（.*$/,""):o.now;return'<div class="agx'+(sm?' sm':'')+'" data-ag="'+i+'"'+(sm?' data-sm="1"':'')+'><span>今天 <b>'+nw+'</b></span>'+(o.enr?'<span>入托時 <b>'+o.enr+'</b>'+(o.cls&&!sm?'・'+o.cls[0]:'')+'</span>':'')+'</div>'}
// 依預計就讀日期自動勾班級；年紀欄存今天的年齡
function auto(i){var r=D.rows[i],o=info(r),ch=false;if(!o)return false;var a=o.now.replace(/（.*$/,"");if(r.ag!==a){r.ag=a;ch=true}
 if(o.cls)CLS.forEach(function(c){var v=c===o.cls;if(!!r[c[3]]!==v){if(v)r[c[3]]=true;else delete r[c[3]];ch=true}});return ch}
function upd(i){document.querySelectorAll('[data-ag="'+i+'"]').forEach(function(x){var h=agHtml(i,!!x.dataset.sm);if(h)x.outerHTML=h});CLS.forEach(function(c){document.querySelectorAll('[data-i="'+i+'"][data-f="'+c[3]+'"]').forEach(function(x){x.checked=!!D.rows[i][c[3]]})})}
function clsNote(){return'班級月齡（依預計就讀日期自動勾選）：'+CLS.map(function(c){return c[0]+" "+c[1]+(c[2]>=99?" 個月以上":"～"+c[2]+" 個月")}).join("、")+' <a href="#" id="clsed" style="color:#57704f">修改</a>'}
document.addEventListener("click",function(e){if(!e.target.closest||!e.target.closest("#clsed"))return;e.preventDefault();var s=prompt("各班月齡，格式：最小-最大\n依序 嫩芽班、花曦班、晴空班，用逗號分開",CLS.map(function(c){return c[1]+"-"+c[2]}).join(", "));if(!s)return;
 var P=s.split(/[,，、]/).map(function(x){var m=x.trim().match(/^(\d+)\s*[-~～]\s*(\d+)$/);return m?[+m[1],+m[2]]:null});if(P.length!==3||P.some(function(x){return!x})){alert("格式不對，例如：0-11, 12-20, 21-36");return}
 P.forEach(function(x,k){CLS[k][1]=x[0];CLS[k][2]=x[1]});KV.setItem("visit:classes",JSON.stringify(CLS.map(function(c){return[c[0],c[1],c[2]]})));var any=false;D.rows.forEach(function(r,i){if(auto(i))any=true});if(any)save();render()});
var WAVE='<svg class="wave" viewBox="0 0 200 10" preserveAspectRatio="none"><path d="M0 6 C40 0 80 10 120 5 S180 2 200 6 V10 H0Z" fill="#6f8667"/></svg>';
var COLS='<colgroup><col style="width:6%"><col style="width:16%"><col style="width:19%"><col style="width:18%"><col style="width:13%"><col></colgroup>';
$("wrap").addEventListener("input",function(e){var t=e.target;if(t.classList.contains("who")){D.who=t.value;document.querySelectorAll(".who").forEach(function(x){if(x!==t)x.value=t.value});return save()}var i=t.dataset.i,f=t.dataset.f;if(i==null)return;D.rows[+i][f]=t.type==="checkbox"?t.checked:t.value;if(/^(by|bm|bd|ey|em|ed)$/.test(f)){auto(+i);upd(+i)}document.querySelectorAll('[data-i="'+i+'"][data-f="'+f+'"]').forEach(function(x){if(x===t)return;if(x.type==="checkbox")x.checked=t.checked;else x.value=t.value});save()});
mo.addEventListener("change",function(){flush();load()});
// 列出前後幾個月有登記資料的月份，點一下切換（快速登記會依參觀日期放到那個月）
function months(){var el=$("mlist");if(!el){el=document.createElement("p");el.id="mlist";el.className="hint";$("wrap").parentNode.insertBefore(el,$("wrap"))}var b=mo.value.split("-").map(Number),out=[];
 for(var d=-6;d<=6;d++){var y=b[0],m=b[1]+d;while(m<1){m+=12;y--}while(m>12){m-=12;y++}var k=y+"-"+String(m).padStart(2,"0"),X=null;try{X=JSON.parse(KV.getItem("visit:"+k)||"null")}catch(e){}
  var n=X&&X.rows?X.rows.filter(function(r){return r&&(r.p||r.ph||r.c)}).length:0;if(n)out.push('<a href="#" data-mo="'+k+'" style="color:#57704f;font-weight:'+(k===mo.value?'800':'400')+'">'+y+'年'+m+'月（'+n+' 位）</a>')}
 el.innerHTML=(out.length?"📅 有登記資料的月份："+out.join("、")+"<br>":"")+clsNote();}
document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("[data-mo]");if(!a)return;e.preventDefault();flush();mo.value=a.dataset.mo;load()});
// 手機上整張表縮放到螢幕寬度，不會被切掉（可以兩指放大）；列印時不縮放
function fit(){return;var w=$("wrap"),sh=w.querySelectorAll(".sheet");if(!sh.length)return;var avail=w.clientWidth-20,full=794,z=Math.min(1,avail/full);sh.forEach(function(x){x.style.zoom=z<1?z:""})}
window.addEventListener("resize",fit);
// 列印前取消螢幕縮放（iPhone 列印會沿用螢幕上的縮放，表格會被擠壓切掉）
function unfit(){document.querySelectorAll(".sheet").forEach(function(x){x.style.zoom=""})}window.addEventListener("beforeprint",unfit);window.addEventListener("afterprint",fit);try{matchMedia("print").addEventListener("change",function(e){e.matches?unfit():fit()})}catch(e){}new MutationObserver(fit).observe($("wrap"),{childList:true});
// ===== 快速登記：接電話時填這裡，自動填進對應月份的下一個空白列 =====
(function(){var q=document.createElement("div");q.className="qk";
 var td=function(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
 q.innerHTML='<h3>⚡ 快速登記</h3><div class="g2"><label>家長姓名<input id="q_p"></label><label>聯絡電話<input id="q_ph" type="tel" inputmode="tel"></label><label>參觀日期<input id="q_v" type="date"></label><label>參觀時間<input id="q_vt" type="time" step="900"></label><label>孩子姓名<input id="q_c"></label><label>出生日／預產期<input id="q_b" type="date"></label><label class="ck2"><input id="q_due" type="checkbox"> 這是預產期</label><label>預計就讀<input id="q_e" type="date"></label><label>今天年紀（自動算）<input id="q_ag" placeholder="填出生日會自動算"></label></div>'+
  '<div class="rw"><span>班別</span><label class="chip"><input type="checkbox" id="q_k1">嫩芽班</label><label class="chip"><input type="checkbox" id="q_k2">花曦班</label><label class="chip"><input type="checkbox" id="q_k3">晴空班</label></div>'+
  '<div class="rw"><span>目前有無入托</span><label class="chip"><input type="radio" name="q_t" value="t1">有</label><label class="chip"><input type="radio" name="q_t" value="t2">無</label></div>'+
  '<label class="full">備註<input id="q_n"></label><div class="rw" style="margin-top:8px"><button type="button" id="q_ok">登記</button><span id="q_msg"></span></div>';
 $("wrap").parentNode.insertBefore(q,$("wrap"));$("q_v").value=td();
 function ag(){var b=$("q_b").value,v=td();if(!b)return;if($("q_due").checked||b>v){$("q_ag").value="未出生";return}
  var B=b.split("-").map(Number),V=v.split("-").map(Number),m=(V[0]-B[0])*12+(V[1]-B[1])-(V[2]<B[2]?1:0);$("q_ag").value=m<12?m+"個月":Math.floor(m/12)+"歲"+(m%12?m%12+"個月":"")}
 ["q_b","q_v","q_due"].forEach(function(id){$(id).addEventListener("change",ag)});
 function roc(s){var a=(s||"").split("-");return a.length<3?["","",""]:[String(+a[0]-1911),String(+a[1]),String(+a[2])]}
 $("q_ok").onclick=function(){var p=$("q_p").value.trim(),ph=$("q_ph").value.trim(),c=$("q_c").value.trim();if(!p&&!ph){alert("請至少填家長姓名或電話");return}
  var v=$("q_v").value||td(),ym=v.slice(0,7),b=roc($("q_b").value),e=roc($("q_e").value),vv=roc(v),t=document.querySelector('input[name=q_t]:checked');
  var row={p:p,ph:ph,vm:vv[1],vd:vv[2],vt:$("q_vt").value,c:c,by:b[0],bm:b[1],bd:b[2],due:$("q_due").checked,ey:e[0],em:e[1],ed:e[2],k1:$("q_k1").checked,k2:$("q_k2").checked,k3:$("q_k3").checked,ag:$("q_ag").value.trim(),n1:$("q_n").value.trim()};
  if(t)row[t.value]=true;Object.keys(row).forEach(function(k){if(row[k]===""||row[k]===false)delete row[k]});
  var k="visit:"+ym,X=null;try{X=JSON.parse(KV.getItem(k)||"null")}catch(x){}if(!X||!X.rows)X={rows:[],who:""};
  var dup=X.rows.findIndex(function(r){return r&&((ph&&r.ph===ph)||(p&&r.p===p))&&r.vm===row.vm&&r.vd===row.vd});if(dup>-1&&!confirm((p||ph)+" 在 "+row.vm+"/"+row.vd+" 已經登記過了（第 "+(dup+1)+" 位），還要再登記一次嗎？"))return;
  flush();X=null;try{X=JSON.parse(KV.getItem(k)||"null")}catch(x){}if(!X||!X.rows)X={rows:[],who:""};
  var i=X.rows.findIndex(function(r){return!r||!Object.keys(r).some(function(f){return r[f]})});if(i<0){i=X.rows.length;for(var j=0;j<PER;j++)X.rows.push({})}
  X.rows[i]=row;KV.setItem(k,JSON.stringify(X));
  q.querySelectorAll("input").forEach(function(x){if(x.type==="checkbox"||x.type==="radio")x.checked=false;else if(x.id!=="q_v"&&x.id!=="q_vt")x.value=""});
  mo.value=ym;load();$("q_msg").textContent="✓ 已登記在 "+ym.replace("-","年")+"月 第 "+(i+1)+" 位（第 "+(Math.floor(i/PER)+1)+" 頁）";
  var el=document.querySelector('[data-i="'+i+'"]');if(el)el.closest("tr").scrollIntoView({behavior:"smooth",block:"center"})};
})();

$("add").onclick=function(){for(var j=0;j<PER;j++)D.rows.push({});render();save()};
$("del").onclick=function(){var last=D.rows.slice(-PER);if(last.some(function(r){return Object.keys(r).some(function(k){return r[k]})})&&!confirm("最後一頁有資料，確定刪除？"))return;D.rows.splice(-PER);render();save()};
load();
})();
</script>
<script type="module">import { startApp } from "./cloud.js"; startApp();</script>
