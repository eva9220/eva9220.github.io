var PK=null;
function openPk(h){var p=document.getElementById("pk");p.innerHTML='<div class="pks">'+h+'</div>';p.className="open"}
function closePk(){document.getElementById("pk").className=""}
function drawDm(i){PK={dm:i};var h='<div class="pkh"><b>選擇發展領域</b><span><button data-pkx="x">關閉</button></span></div>';for(var n=1;n<=5;n++)h+='<button class="pki'+(S.rows[i].d==n?' on':'')+'" data-dpick="'+n+'" style="border-left:8px solid '+DN[n].c+'">'+DN[n].n+'</button>';openPk(h)}
function drawIb(i,s){PK={r:i,s:s};var d=S.rows[i].d,cur=S.rows[i]["i"+s];var h='<div class="pkh"><b>選擇能力指標・'+DN[d].n+'</b><span><button data-pkx="clr">清除</button><button data-pkx="x">關閉</button></span></div>';
  IND[d].forEach(function(arr,b){h+='<div class="pkb">'+BR[b]+'級・'+BL[b]+(CB[S.cls].indexOf(b)>=0?' <em>'+CL[S.cls].n+'建議</em>':'')+'</div>';arr.forEach(function(x,n){var c=BR[b]+"-"+d+"-"+(n+1);h+='<button class="pki'+(c==cur?' on':'')+'" data-pick="'+c+'"><b>'+c+'</b> '+esc(x)+'</button>'})});openPk(h)}
document.addEventListener("input",function(e){var el=e.target;if(el.dataset&&el.dataset.p){sp(el.dataset.p,el.value);save();var pv=el.parentNode.querySelector(".pv");if(pv)pv.innerHTML=nl(el.value)}});
document.addEventListener("change",function(e){var el=e.target;
  if(el.hasAttribute&&el.hasAttribute("data-cls")){S.cls=+el.value;S.rows.forEach(function(r){r.a1=CL[S.cls].a[0];r.a2=CL[S.cls].a[1]});save();render()}
  if(el.hasAttribute&&el.hasAttribute("data-date")){S.date=el.value;save();render()}});
document.addEventListener("click",function(e){var t=e.target;
  if(t.id=="pk"){closePk();return}
  var b;
  if(b=t.closest("[data-pkx]")){if(b.dataset.pkx=="clr"&&PK){S.rows[PK.r]["i"+PK.s]="";save();render()}closePk();return}
  if(b=t.closest("[data-dpick]")){if(PK&&PK.dm!=null){var r=S.rows[PK.dm];r.d=+b.dataset.dpick;r.i1="";r.i2="";save();closePk();render()}return}
  if(b=t.closest("[data-pick]")){if(PK&&PK.r!=null){S.rows[PK.r]["i"+PK.s]=b.dataset.pick;save();closePk();render()}return}
  if(b=t.closest("[data-dm]")){drawDm(+b.dataset.dm);return}
  if(b=t.closest("[data-ib]")){var a=b.dataset.ib.split(".");drawIb(+a[0],+a[1]);return}
  if(b=t.closest("[data-ck]")){var k=b.dataset.ck;S.ck[k]=!S.ck[k];save();render();return}
  if(t.id=="pb"){window.print();return}
  if(t.id=="cl"){if(confirm("確定要清空這份週誌的所有內容嗎?")){S=fresh();save();render()}}
});
render();
