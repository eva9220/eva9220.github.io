<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>各式表單｜初晴之森托嬰中心</title>
<style>
:root{--bg:#fbf6ef;--ink:#4d4a47;--sub:#8a7d68;--line:#e3e0d6;--g:#86ab98}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding-bottom:40px}
.top{background:#f3e6c2;border-bottom:3px solid #d8c48c;padding:14px 16px;display:flex;align-items:center;gap:12px}
.top a{color:var(--ink);text-decoration:none;border:2px solid #4d4a47;border-radius:99px;padding:4px 14px;background:#fff;font-size:14px}
.top b{font-size:20px;letter-spacing:.08em}
main{max-width:640px;margin:0 auto;padding:16px 14px}
.hint{color:var(--sub);font-size:14px;margin:6px 0 14px}
.card{display:block;background:#fff;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 3px 0 var(--line);text-decoration:none;color:var(--ink);border-left:8px solid var(--g)}
.card h3{margin:0 0 4px;font-size:18px}
.card small{color:var(--sub)}
.card.off{opacity:.55;border-left-color:#cfc6b6;pointer-events:none}
.tag{display:inline-block;font-size:12px;background:#e2f0e6;border-radius:99px;padding:0 8px;margin-left:6px}
</style>
</head>
<body>
<div class="top"><a href="index.html">← 首頁</a><b>各式表單</b></div>
<main>
  <p class="hint">請選擇表單</p>
  <a class="card" href="leave.html">
    <h3>📝 請假交接單 <span class="tag">可使用</span></h3>
    <small>請假申請與交接事項記錄，每位幼兒各一段交接</small>
  </a>
  <div class="card off">
    <h3>⚠️ 事故單</h3>
    <small>尚未開放</small>
  </div>
  <div class="card off">
    <h3>🦠 個案異常表</h3>
    <small>尚未開放</small>
  </div>
  <div class="card off">
    <h3>🧹 清潔表單</h3>
    <small>尚未開放</small>
  </div>
  <div class="card off">
    <h3>📞 電訪表</h3>
    <small>尚未開放</small>
  </div>
</main>
</body>
</html>
