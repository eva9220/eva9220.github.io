<html lang="zh-Hant"><head><meta charset="utf-8">

<style>
:root{--bg:#fdf8ee;--ink:#4d4a47;--sub:#8c857d;color-scheme:light}*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:hidden;background-color:var(--bg);background-image:radial-gradient(#e9dcc3 1.3px,transparent 1.6px);background-size:22px 22px}
.hero{position:relative;text-align:center;padding:calc(30px + env(safe-area-inset-top,0px)) 16px 30px;margin:8px 10px 0}
.blob{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.hero>*:not(.blob):not(.tape):not(.d){position:relative;z-index:1}
.hero img{width:100px;filter:drop-shadow(0 3px 0 rgba(77,74,71,.15))}
.hero h1{margin:2px 0 0;font-size:24px;letter-spacing:.06em;transform:rotate(-1.5deg);text-shadow:2px 2px 0 #fff}
.hero p{margin:2px 0 0;font-size:12px;letter-spacing:.14em;color:#6f6592}
.tape{position:absolute;z-index:2;width:78px;height:24px;opacity:.9;background:repeating-linear-gradient(45deg,#c3b2e2 0 6px,#e0d6f1 6px 12px)}
svg.d{position:absolute;z-index:1;fill:none;stroke:#4d4a47;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;filter:url(#r2)}svg.d .y{fill:#f6d77a}svg.d .w{fill:#fffdf9}
h2{text-align:center;font-size:16px;letter-spacing:.3em;color:var(--sub);margin:26px 0 18px;transform:rotate(-1deg)}
main{max-width:560px;margin:0 auto;padding:0 16px 30px}
.card{position:relative;display:flex;align-items:center;gap:14px;background:#fffdf9;border-radius:30px 36px 28px 34px/34px 28px 36px 30px;padding:16px 16px 16px 14px;margin:0 6px 22px;text-decoration:none;color:var(--ink);box-shadow:5px 6px 0 var(--k);transition:transform .15s}
.card::before{content:"";position:absolute;inset:-1px;border:2.6px solid var(--ink);border-radius:30px 36px 28px 34px/34px 28px 36px 30px;filter:url(#r2);pointer-events:none}
.card::after{content:"";position:absolute;top:-10px;left:22px;width:54px;height:20px;background:var(--k);opacity:.85;transform:rotate(-6deg);border-radius:2px}
a.card:active{transform:translate(3px,4px);box-shadow:2px 2px 0 var(--k)}
.ic{flex:none;width:66px;height:66px;border-radius:26px 20px 28px 22px;background:var(--bg2);display:flex;align-items:center;justify-content:center}
.tx{flex:1;min-width:0}.tx small{display:block;color:var(--k);font-weight:800;font-size:11px;letter-spacing:.16em;filter:brightness(.85)}.tx b{display:block;font-size:19px;line-height:1.35}.tx span{display:block;color:var(--sub);font-size:13px;line-height:1.5}
.ar{font-size:26px;color:var(--ink)}.soon{opacity:.62}.soon .bd{display:inline-block;background:#f1e6da;border-radius:999px;padding:0 10px;font-size:12px;margin-top:2px}
.note{margin:6px 6px 0;background:#fffdf9;border:2px dashed #cdbfa9;border-radius:22px;padding:12px 16px;font-size:13px;color:var(--sub)}
</style></head><body>

<style>
:root{--bg:#fbf6ef;--card:#fffdf9;--ink:#4d4a47;--sub:#8c857d;--teal:#b07f20;--o:#dc8f80;--line:#eadfd2;

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
a{color:var(--teal);text-decoration:none;font-size:14px}
h1{font-size:22px;margin:8px 0 2px}
.meta{color:var(--sub);font-size:14px;margin:0 0 12px}
.book{background:var(--card);border-left:5px solid var(--teal);border-radius:18px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.tabs{display:flex;gap:8px;margin-bottom:6px}
.tabs button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 4px;font:inherit;font-size:14px;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--o);border-color:var(--o);color:#fff}
.age{font-size:13px;color:var(--sub);margin:0 0 14px;text-align:center}
.wk{font-weight:700;margin:18px 0 8px;font-size:15px}
.card{border-radius:26px;padding:16px 16px 14px;margin-bottom:14px;border-left:6px solid var(--b);background:var(--c)}
.d{color:var(--o);font-weight:700;font-size:17px}
.dom{color:var(--sub);font-weight:700;font-size:14px;margin:2px 0}
.t{font-size:20px;font-weight:800;margin:2px 0 10px}
.ind{display:inline-block;background:rgba(0,0,0,.07);border-radius:8px;padding:2px 10px;font-weight:700;font-size:14px;margin:0 6px 10px 0}
.txt{background:var(--card);border-radius:12px;padding:12px 14px;font-size:15px}
.rl{color:var(--teal);font-weight:700;font-size:14px;margin:12px 0 6px}
.edit-on [contenteditable]{outline:1.5px dashed var(--teal);border-radius:6px;padding:0 4px}
.rx{margin-left:6px;color:#c33;cursor:pointer;font-weight:700}
.addr{border:1px dashed var(--teal);color:var(--teal);background:var(--card);cursor:pointer;font:inherit;font-size:13px}
.eb{display:flex;gap:8px;margin:0 0 10px}.eb button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.xl{color:#6f9a85;font-weight:800;font-size:14px;margin-top:8px}.xv{font-size:16px}
.tag{display:inline-block;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:2px 10px;margin:0 6px 6px 0;font-size:13px}
.fest{background:var(--card);border-radius:12px;padding:10px 14px;font-size:14px}
.fest p{margin:4px 0}
button.ind{border:0;font:inherit;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;text-align:left}
button.add{background:var(--card);border:1px dashed var(--teal);color:var(--teal)}

:root{--ink:#222;--line:#222;--teal:#e6f1ea;--green:#86ab98;--bg:#fbf6ef}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}

.g{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--line);margin-bottom:10px}
.g label{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--line);font-weight:700;font-size:14px}

.g input,.g select{border-bottom:1px dashed #999}
.dom{border:2px solid var(--line);margin-bottom:10px}

.ps{display:grid;grid-template-columns:1fr 1fr}

.ph:last-child{border-right:0}

.ph input{display:none}
.x{position:absolute;top:4px;right:4px;z-index:2;border:0;border-radius:50%;width:26px;height:26px;background:rgba(0,0,0,.55);color:#fff;font-size:14px}
.box{border:2px solid var(--line);margin-bottom:10px}
.box textarea{display:block;height:100px;padding:8px 10px;resize:vertical}
canvas{display:block;width:100%;height:150px;touch-action:none;border-top:1px dashed #999;background:#fff}

button.b{border:1px solid #bbb;background:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.bar{display:flex;gap:10px;margin:14px 0 24px}

.bar .p{background:var(--green);border-color:var(--green);color:#fff}

.pt,.th{display:none}

main{padding:0;max-width:none}
.bar,.x,a,.sg button,#note,.hn,.ph span,#hint{display:none}
.head{margin:0 0 2px;flex-wrap:nowrap}.head img{height:13mm}.head h1{font-size:18pt}
.g{grid-template-columns:repeat(4,1fr);border:2px solid #000;border-bottom:0;margin:0}

.dh span{display:block;font-size:8pt;margin:0!important}
.dom textarea,.box textarea{display:none}

.box .pt{grid-column:2;min-height:15mm;padding:3px 6px;font-size:9pt}

}

.sh-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}.sh-h b{flex:1;font-size:17px}
.srow{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.srow .row{flex:1;text-align:left;border:1.5px solid #ddd;background:#fff;border-radius:16px;padding:10px 14px;font:inherit;font-size:15px;cursor:pointer}
.srow .row.on{background:#9dbfae;border-color:#9dbfae;color:#fff}
.del{border:0;background:none;color:#999;font-size:16px;padding:6px 8px;cursor:pointer}
#nn{border:1.5px dashed #9dbfae;border-radius:16px;padding:10px 14px;background:#fff}

  "2027-01": "每週五寢具清潔清洗\n二月份營養菜單分享\n1/28寶寶體位測量\n1/24遊戲器材檢核\n1/24設施設備安全自評\n1/15衛教(嬰幼兒)：我是洗手高手\n飲水機濾心更換(季/次)\n水質檢測(季/次)",
  "2027-02": "每週五寢具清潔清洗\n二月份營養菜單分享\n2/13 年前提前一天休園\n2/23 開學日\n2/25 體位測量"

function calHTML(mk) {

  var blob = new Blob(["﻿", html], { type: "application/msword" });

<div class="wrap" id="wrap"></div><div class="tools"><button type="button" id="add">＋ 新增一頁（15 列）</button><button type="button" id="del">－ 刪除最後一頁</button></div>
<script type="text/plain" data-app>
(function(){
var $=function(i){return document.getElementById(i)},mo=$("mo"),now=new Date();

function E(v){return String(v==null?"":v).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function ti(i,f,c,ph){return '<input class="'+(c||"")+'" data-i="'+i+'" data-f="'+f+'" value="'+E(D.rows[i][f])+'"'+(ph?' inputmode="numeric"':'')+'>'}

'<td><div class="dt"><div class="ymd">'+ti(i,"by","y",1)+'年'+ti(i,"bm","",1)+'月'+ti(i,"bd","",1)+'日</div>'+cb(i,"due","預產期")+'</div></td>'+
'<td><div class="dt"><div class="ymd">'+ti(i,"ey","y",1)+'年'+ti(i,"em","",1)+'月'+ti(i,"ed","",1)+'日</div><div></div></div></td>'+
'<td><div class="cls">'+cb(i,"k1","嫩芽班")+cb(i,"k2","花曦班")+cb(i,"k3","晴空班")+'</div></td><td>'+ti(i,"ag","f")+'</td>'+
'<td class="nt">'+ti(i,"n1")+ti(i,"n2")+'</td></tr>'}
h+='<div class="sheet"><div class="hd"><div class="org"><small>臺南市私立</small><h1>初晴之森托嬰中心</h1></div><div class="pill">家長預約登記表</div><div class="meta"><b>'+ym[0]+'</b>年<b>'+(+ym[1])+'</b>月　第<b>'+(pg+1)+'</b>頁</div>'+WAVE+'</div><div class="body"><table>'+COLS+'<tbody>'+r+'</tbody></table></div><div class="ft">行政內部使用・請妥善保管，勿對外提供<span>填表人<input class="who" value="'+E(D.who)+'"></span></div></div>'}
$("wrap").innerHTML=h;$("del").style.display=pages>1?"":"none"}
var WAVE='<svg class="wave" viewBox="0 0 200 10" preserveAspectRatio="none"><path d="M0 6 C40 0 80 10 120 5 S180 2 200 6 V10 H0Z" fill="#6f8667"/></svg>';

 if(!R.w||R.w.length!==8)R.w=clone(DEF.w);if(!R.ov)R.ov={};if(!R.rule)R.rule=clone(DEF.rule);}

function d0(x){var d=new Date(x+"T00:00:00");return isNaN(d)?null:d}
function iso(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2)}
function fmt(d){return (d.getMonth()+1)+"/"+d.getDate()}
function add(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function today(){var t=new Date();t.setHours(0,0,0,0);return t}
function monday(d){var x=new Date(d);x.setHours(0,0,0,0);return add(x,-((x.getDay()+6)%7))}
var THIS=monday(today()),wk=THIS,mo=new Date(today().getFullYear(),today().getMonth(),1);
// 某週在 8 週循環裡是第幾週（0–7）；沒設定開始日期時為 null
function cyc(m){var d=d0(st.value);if(!d)return null;var w=Math.round((m-monday(d))/DAY/7);return((w%8)+8)%8}
function row(m){var o=R.ov[iso(m)];if(o)return o;var c=cyc(m);return c==null?null:R.w[c]}
function holIn(m){var a=iso(m),b=iso(add(m,4));return H.filter(function(h){return h[0]>=a&&h[0]<=b}).sort(function(p,q){return p[0]<q[0]?-1:1})}
function hTxt(h){var x=d0(h[0]);return fmt(x)+"（"+WD[x.getDay()]+"）"+h[1]}
function names(s){return String(s||"").split("、").map(function(n){return n.trim()}).filter(Boolean)}
function heading(){
 $("rule").innerHTML=R.rule.filter(function(x){return x.trim()}).map(function(x){return '<span'+(x.indexOf("→")>=0?' class="flow"':'')+'>'+E(x)+'</span>'}).join("");
}
// 本週卡片（可往前、往後一週）
function week(){
 var n=Math.round((wk-THIS)/DAY/7);
 $("wkno").textContent=n===0?"本週":n===1?"下週":n===-1?"上週":fmt(wk)+" 那週";
 $("range").textContent=fmt(wk)+"（一）～ "+fmt(add(wk,4))+"（五）";
 var r=row(wk);
 $("cur").innerHTML=r?S.map(function(s,j){return '<div class="sh" style="--bg2:'+s[4]+';--c:'+s[3]+'"><i>'+s[2]+'</i><b>'+s[0]+'</b><em>'+s[1]+'</em><div class="who">'+names(r[j]).map(function(n){return "<span>"+E(n)+"</span>"}).join("")+'</div></div>'}).join(""):'<p class="hint2">'+(MGR?"請先設定下方的開始日期":"管理者設定開始日期後，就會顯示值班人員")+'</p>';
 $("curh").innerHTML=holIn(wk).map(function(h){return "<div>🎌 "+E(hTxt(h))+" 放假</div>"}).join("");
}
// 這個月有上班日（週一到週五）的每一週
function monthWeeks(){var out=[],m=monday(mo),end=new Date(mo.getFullYear(),mo.getMonth()+1,1);
 while(m<end){if(add(m,4)>=mo)out.push(m);m=add(m,7)}return out}
function month(){
 $("mlab").textContent=mo.getFullYear()+" 年 "+(mo.getMonth()+1)+" 月";
 var ws=monthWeeks();
 if(!st.value){$("tb").innerHTML='<tr><td colspan="6" style="padding:18px 4px;color:var(--sub);font-weight:400">'+(MGR?"請先在「本週」卡片下方設定第 1 週的開始日期":"管理者設定開始日期後，就會顯示每月班表")+'</td></tr>';return}
 $("tb").innerHTML=ws.map(function(m){var r=row(m),on=+m===+THIS,k=iso(m),hs=holIn(m);
  return '<tr'+(on?' class="on"':'')+'><td>'+fmt(m)+'～'+fmt(add(m,4))+(on?' 👈':'')+(R.ov[k]&&EDIT?'<small>（本週已單獨修改）</small>':'')+hs.map(function(h){return '<span class="hb">🎌 '+E(hTxt(h))+'</span>'}).join("")+'</td>'+
  r.map(function(x,j){return "<td>"+(EDIT?'<input data-k="'+k+'" data-j="'+j+'" value="'+E(x)+'" aria-label="'+fmt(m)+' 那週 '+S[j][0]+'">':E(x))+"</td>"}).join("")+"</tr>"}).join("")}
// 8 週輪值循環（只在編輯時出現）
function cycle(){
 $("cyc").hidden=!EDIT;if(!EDIT)return;
 $("tb2").innerHTML=R.w.map(function(w,i){return '<tr><td>第 '+(i+1)+' 週</td>'+w.map(function(x,j){return '<td><input data-i="'+i+'" data-j="'+j+'" value="'+E(x)+'" aria-label="循環第 '+(i+1)+' 週 '+S[j][0]+'"></td>'}).join("")+"</tr>"}).join("")}
function hols(){
 $("hol").hidden=!EDIT;if(!EDIT)return;
 $("hlist").innerHTML='<p class="etip">只要列「上班日要放假」的日子（含補假）；有放假的週會在本週卡片和每月班表標出來</p><div id="hrows">'+H.map(hRow).join("")+'</div><div style="text-align:center;margin-top:8px"><button type="button" class="addh" id="addh">＋ 新增假日</button></div><div style="text-align:center;margin-top:16px"><button type="button" class="addh" id="brs">↺ 班表與假日全部還原預設</button></div>';
 $("addh").onclick=function(){$("hrows").insertAdjacentHTML("beforeend",hRow(["",""]))};
 var rs=0;$("brs").onclick=function(){if(!rs){rs=1;this.textContent="再按一次確認還原";return}
  R=clone(DEF);H=clone(HDEF);try{KV.removeItem(KR);KV.removeItem(KH)}catch(e){}setEdit(false)};
}
function hRow(h){return '<div class="he"><input type="date" value="'+E(h[0])+'" aria-label="日期"><input type="text" value="'+E(h[1])+'" placeholder="假日名稱" aria-label="假日名稱"><button type="button" onclick="this.parentNode.remove()" aria-label="刪除">✕</button></div>'}
function bar(){
 $("pbtn").style.display=EDIT?"none":"";
 if(!MGR){$("ebtn").innerHTML="";return}
 $("ebtn").innerHTML=EDIT?'<button type="button" class="sv" id="bsv">💾 儲存</button> <button type="button" id="bcx">取消</button>':'<button type="button" class="ed" id="bed">✏️ 編輯</button>';
 if(!EDIT){$("bed").onclick=function(){setEdit(true)};return}
 $("bsv").onclick=save;
 $("bcx").onclick=function(){loadAll();setEdit(false)};
}
function all(){week();month();cycle();hols()}
function setEdit(on){EDIT=on;$("etip").hidden=!on;
 if(on){
  $("rule").innerHTML='<textarea class="etx" id="erule" rows="3" aria-label="上方說明（一行一個）">'+E(R.rule.join("\n"))+'</textarea>';
 }else heading();
 all();bar();
}
function clean(v){return v.replace(/[,，、\s]+/g,"、").replace(/^、|、$/g,"")}
// 先讀月表目前的值（儲存循環前），再更新循環，最後把和循環不同的週記成單獨修改
function readMonth(){var o={};document.querySelectorAll("#tb input").forEach(function(x){(o[x.dataset.k]=o[x.dataset.k]||[])[+x.dataset.j]=clean(x.value)});return o}
function keepMonth(o){Object.keys(o).forEach(function(k){var c=cyc(d0(k)),base=R.w[c];
 if(o[k].join("|")===base.join("|"))delete R.ov[k];else R.ov[k]=o[k]})}
function save(){
 var o=readMonth(),old=clone(R.w);
 document.querySelectorAll("#tb2 input").forEach(function(x){R.w[+x.dataset.i][+x.dataset.j]=clean(x.value)});
 // 循環改了，但月表那格沒動 → 跟著新的循環走
 Object.keys(o).forEach(function(k){var c=cyc(d0(k));o[k]=o[k].map(function(v,j){return !R.ov[k]&&v===old[c][j]?R.w[c][j]:v})});
 keepMonth(o);
 R.rule=$("erule").value.split("\n").map(function(x){return x.trim()}).filter(Boolean);
 var nh=[];document.querySelectorAll("#hrows .he").forEach(function(r){var v=r.querySelectorAll("input");if(v[0].value&&v[1].value.trim())nh.push([v[0].value,v[1].value.trim()])});
 H=nh.sort(function(p,q){return p[0]<q[0]?-1:1});
 try{KV.setItem(KR,JSON.stringify(R));KV.setItem(KH,JSON.stringify(H))}catch(e){alert("儲存失敗，請再試一次");return}
 setEdit(false);
}
// 編輯中換月份時，先把這個月改過的格子記下來
function flip(n){if(EDIT&&st.value)keepMonth(readMonth());mo=new Date(mo.getFullYear(),mo.getMonth()+n,1);month()}
var TH="<tr><th>週次</th>"+S.map(function(s){return '<th style="--c:'+s[3]+'"><span></span>'+s[0]+"<em>"+s[1]+"</em></th>"}).join("")+"</tr>";
$("th").innerHTML=TH;$("th2").innerHTML=TH;
st.value=(window.KV&&KV.getItem(K))||"";
st.addEventListener("change",function(){if(window.KV)KV.setItem(K,st.value);all()});
$("prev").onclick=function(){wk=add(wk,-7);week()};$("next").onclick=function(){wk=add(wk,7);week()};
$("mprev").onclick=function(){flip(-1)};$("mnext").onclick=function(){flip(1)};
// 只有管理者（admin）與主管（supervisor）看得到編輯功能；雲端規則也只允許他們寫入值班表資料
function role(cb){try{var SF=window.parent&&window.parent!==window&&window.parent.__SF;if(SF&&SF.gate)return SF.gate(function(u){cb(u||{})})}catch(e){}cb({})}
$("setw").style.display="none";
heading();all();bar();
role(function(u){MGR=u.role==="admin"||u.role==="supervisor";$("setw").style.display=MGR?"":"none";all();bar()});
})();
<\/script>
<script type="module">parent.__startApp(window);<\/script>
</body>
</html>
</script>

<script type="text/plain" id="pg-leave"><!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>請假交接單｜初晴之森托嬰中心</title>
<style>
:root{--bg:#fbf6ef;--ink:#4d4a47;--sub:#8a7d68;--line:#e3e0d6;--g:#86ab98;--red:#c96d5f}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding-bottom:40px}
.top{background:#f3e6c2;border-bottom:3px solid #d8c48c;padding:12px 14px;display:flex;align-items:center;gap:12px}
.top a{color:var(--ink);text-decoration:none;border:2px solid var(--ink);border-radius:99px;padding:4px 12px;background:#fff;font-size:14px;white-space:nowrap}
.top b{font-size:18px;letter-spacing:.06em}
main{max-width:760px;margin:0 auto;padding:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
select,input,textarea,button{font:inherit;font-size:15px}
select,input,textarea{border:1.5px solid var(--line);border-radius:10px;padding:7px 9px;background:#fff;color:var(--ink);min-width:0;max-width:100%}
textarea{width:100%;min-height:70px}
button{border:1.5px solid var(--g);background:#fff;color:var(--ink);border-radius:99px;padding:7px 14px;cursor:pointer}
button.primary{background:var(--g);color:#fff}
button.mgr{border-color:#d2a35c;color:#7a5a1c}
.sum{font-size:14px;color:var(--sub);margin-bottom:8px}
.item{display:block;width:100%;text-align:left;background:#fff;border:0;border-left:7px solid var(--g);border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:0 3px 0 var(--line);cursor:pointer}
.item b{font-size:16px}
.item small{color:var(--sub);display:block}
.tag{display:inline-block;font-size:12px;border-radius:99px;padding:0 8px;margin-left:6px;background:#eef0ea;color:#6b6457}
.tag.sent{background:#dfe9f5;color:#3c5f86}
.tag.rev{background:#e2f0e6;color:#2f6b45}
.tag.new{background:#f8dcd5;color:#a4493a}
.sec{background:#fff;border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:0 3px 0 var(--line)}
.sec h2{font-size:16px;margin:0 0 10px;color:#5f5a52}
.sec.kid{border-left:7px solid #b9a3d3}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .full{grid-column:1/-1}
.grid label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--sub)}
.grid label input,.grid label select,.grid label textarea{color:var(--ink);font-size:15px}
.opts{display:flex;flex-wrap:wrap;gap:10px;font-size:14px;color:var(--ink)}
.opts label{display:inline-flex;align-items:center;gap:4px}
.lbl{font-size:13px;color:var(--sub);margin-bottom:4px}
canvas.sig{width:100%;max-width:340px;height:140px;border:1.5px dashed #bbb;border-radius:12px;background:#fff;touch-action:none;display:block}
.sigs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ro input,.ro select,.ro textarea{background:#f4f1ea;color:#555}
.note{font-size:13px;color:var(--sub);background:#fff8e6;border-radius:12px;padding:8px 12px;margin-bottom:12px}
@media (max-width:560px){.grid{grid-template-columns:1fr}.sigs{grid-template-columns:1fr}}
@media print{
  .top,.bar,.no-print,.note{display:none!important}
  body{background:#fff}
  .sec{box-shadow:none;border:1px solid #999}
  main{max-width:none}
}
</style>
</head>
<body>
<div class="top no-print"><a href="forms.html">← 各式表單</a><b>📝 請假交接單</b></div>
<main>

  <section id="listView">
    <div class="bar no-print">
      <select id="selCls"></select>
      <select id="selTeacher"></select>
      <button class="primary" id="btnNew">＋ 新增假單</button>
    </div>
    <div class="sum" id="sum"></div>
    <div id="list"></div>
  </section>

  <section id="editView" hidden>
    <div class="bar no-print">
      <button id="btnBack">← 返回列表</button>
      <span id="stateTag"></span>
    </div>
    <div class="note no-print" id="roNote" hidden></div>
    <form id="form" onsubmit="return false"></form>
    <div class="bar no-print">
      <button id="btnDraft">儲存草稿</button>
      <button class="primary" id="btnSubmit">送出</button>
      <button class="mgr" id="btnReviewed" hidden>標示已閱</button>
      <button id="btnPrint">列印 / 存成 PDF</button>
    </div>
  </section>

</main>

<script type="module">
const SF = parent.__SF;

// ===== 設定：班級、老師、幼兒（之後新增班級或老師只要改這裡）=====
const CLASSES = [
  { name: "嫩芽班", teachers: ["陳慈敏"], kids: [{ id: "L01" }] }
];
const TYPES = ["事假", "病假", "特休", "其他"];
const KID_FIELDS = [
  { k: "meal", t: "radio", l: "飲食食慾狀況", o: ["正常", "量多", "量少"] },
  { k: "sleep", t: "radio", l: "睡眠狀況", o: ["淺睡", "深睡"] },
  { k: "allergy", t: "text", l: "過敏食物" },
  { k: "sleepPref", t: "text", l: "睡眠特殊嗜好" },
  { k: "diaper", t: "checks", l: "尿布更換", o: ["包尿布", "穿著學習褲", "自行表達如廁需求", "訓練如廁"] },
  { k: "milkBreast", t: "text", l: "奶粉沖泡：母奶（cc）" },
  { k: "milkFormula", t: "text", l: "奶粉沖泡：配方奶（cc）" },
  { k: "afternoon", t: "text", l: "下課時間特殊需求" },
  { k: "toilet", t: "checks", l: "排便狀況", o: ["會自行表達如廁需求"] },
  { k: "toiletNote", t: "text", l: "排便其他說明" },
  { k: "shoes", t: "radio", l: "穿鞋", o: ["是", "否"] },
  { k: "note", t: "area", l: "其它說明" }
];

// ===== 狀態 =====
let ME = null, IS_MGR = false, ITEMS = [], unsub = null, EDIT = null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const setPath = (o, p, v) => { const a = p.split("."); let c = o; a.slice(0, -1).forEach((k) => { c[k] = c[k] || {}; c = c[k]; }); c[a[a.length - 1]] = v; };
const getPath = (o, p) => p.split(".").reduce((c, k) => (c == null ? undefined : c[k]), o);
const currentClass = () => CLASSES.find((c) => c.name === $("selCls").value) || CLASSES[0];

// ===== 啟動：登入與權限 =====
SF.gate((u) => {
  ME = u;
  IS_MGR = u.role === "admin" || u.role === "supervisor";
  $("selCls").innerHTML = CLASSES.map((c) => `<option>${esc(c.name)}</option>`).join("");
  fillTeachers();
  $("selCls").onchange = () => { fillTeachers(); renderList(); };
  $("selTeacher").onchange = renderList;
  $("btnNew").onclick = () => openEdit(null);
  $("btnBack").onclick = backToList;
  $("btnDraft").onclick = () => save("草稿");
  $("btnSubmit").onclick = () => { if (confirm("送出後將無法再修改，確定送出？")) save("已送出"); };
  $("btnReviewed").onclick = toggleReviewed;
  $("btnPrint").onclick = () => window.print();
  subscribe();
});

function fillTeachers() {
  const c = currentClass();
  $("selTeacher").innerHTML = `<option value="">全部老師</option>` + c.teachers.map((t) => `<option>${esc(t)}</option>`).join("");
}

// 管理者看全部；一般成員只看自己建立的假單（規則也會限制）
function subscribe() {
  if (unsub) unsub();
  unsub = IS_MGR
    ? SF.watch("leaves", (items) => { ITEMS = items; renderList(); })
    : SF.watchWhere("leaves", "owner", ME.email, (items) => { ITEMS = items; renderList(); });
}

function statusTag(it) {
  if (it.status !== "已送出") return `<span class="tag new">草稿</span>`;
  return it.reviewed ? `<span class="tag rev">已閱</span>` : `<span class="tag sent">已送出・未閱</span>`;
}

function renderList() {
  const cls = $("selCls").value, t = $("selTeacher").value;
  const rows = ITEMS
    .filter((it) => (!cls || it.cls === cls) && (!t || it.teacher === t))
    .sort((a, b) => String(b.updatedAt || "").localeCompare(String(a.updatedAt || "")));
  const unread = rows.filter((it) => it.status === "已送出" && !it.reviewed).length;
  $("sum").textContent = IS_MGR ? `共 ${rows.length} 筆，未閱 ${unread} 筆` : `共 ${rows.length} 筆`;
  $("list").innerHTML = rows.map((it) => `
    <button class="item" data-id="${esc(it.id)}">
      <b>${esc(it.name || "（未填姓名）")}・${esc(it.type || "")}</b> ${statusTag(it)}
      <small>${esc(it.teacher || "")}｜${esc(it.start || "")} ～ ${esc(it.end || "")}｜建立 ${esc((it.createdAt || "").slice(0, 10))}</small>
    </button>`).join("") || `<p style="color:#8a7d68;text-align:center">還沒有假單，按「＋ 新增假單」開始。</p>`;
  document.querySelectorAll("#list .item").forEach((b) => { b.onclick = () => openEdit(b.dataset.id); });
}

// ===== 編輯 =====
function blank() {
  return {
    cls: $("selCls").value, teacher: $("selTeacher").value || currentClass().teachers[0],
    owner: ME.email, status: "草稿", reviewed: false,
    date: today(), name: "", start: "", end: "", area: "", type: "事假",
    agent: "", agentQual: [], agentId: "", afterNote: "", generalNote: "",
    kids: {}, sigAgent: "", sigChief: ""
  };
}

function openEdit(id) {
  if (id === null) {
    EDIT = { id: null, data: blank() };
  } else {
    const it = ITEMS.find((x) => x.id === id);
    if (!it) return;
    const { id: _, ...rest } = it;
    EDIT = { id, data: rest };
  }
  renderForm();
  $("listView").hidden = true;
  $("editView").hidden = false;
  window.scrollTo(0, 0);
}

function backToList() {
  $("editView").hidden = true;
  $("listView").hidden = false;
  renderList();
}

function editable() {
  if (!EDIT) return false;
  if (IS_MGR) return true;
  return EDIT.data.owner === ME.email && EDIT.data.status === "草稿";
}

function inputHTML(path, f, val, ro) {
  const dis = ro ? " disabled" : "";
  if (f.t === "radio") {
    return `<div class="opts">${f.o.map((o) => `<label><input type="radio" name="${path}" data-p="${path}" value="${esc(o)}"${val === o ? " checked" : ""}${dis}>${esc(o)}</label>`).join("")}</div>`;
  }
  if (f.t === "checks") {
    const arr = Array.isArray(val) ? val : [];
    return `<div class="opts">${f.o.map((o) => `<label><input type="checkbox" data-p="${path}" data-v="${esc(o)}"${arr.includes(o) ? " checked" : ""}${dis}>${esc(o)}</label>`).join("")}</div>`;
  }
  if (f.t === "area") return `<textarea data-p="${path}"${dis}>${esc(val)}</textarea>`;
  return `<input type="text" data-p="${path}" value="${esc(val)}"${dis}>`;
}

function renderForm() {
  const d = EDIT.data, ro = !editable();
  const c = CLASSES.find((x) => x.name === d.cls) || currentClass();
  const basic = `
    <div class="sec">
      <h2>基本資料</h2>
      <div class="grid">
        <label>交接日期<input type="date" data-p="date" value="${esc(d.date)}"${ro ? " disabled" : ""}></label>
        <label>請假人姓名<input type="text" data-p="name" value="${esc(d.name)}"${ro ? " disabled" : ""}></label>
        <label>班級<select data-p="cls"${ro ? " disabled" : ""}>${CLASSES.map((x) => `<option${x.name === d.cls ? " selected" : ""}>${esc(x.name)}</option>`).join("")}</select></label>
        <label>假別<select data-p="type"${ro ? " disabled" : ""}>${TYPES.map((x) => `<option${x === d.type ? " selected" : ""}>${x}</option>`).join("")}</select></label>
        <label>請假日期（起）<input type="date" data-p="start" value="${esc(d.start)}"${ro ? " disabled" : ""}></label>
        <label>請假日期（迄）<input type="date" data-p="end" value="${esc(d.end)}"${ro ? " disabled" : ""}></label>
        <label class="full">打掃區域<input type="text" data-p="area" value="${esc(d.area)}"${ro ? " disabled" : ""}></label>
        <label>代理人<input type="text" data-p="agent" value="${esc(d.agent)}"${ro ? " disabled" : ""}></label>
        <label>代理人身分證字號或證號<input type="text" data-p="agentId" value="${esc(d.agentId)}"${ro ? " disabled" : ""}></label>
        <div class="full"><div class="lbl">代理人資格</div>
          <div class="opts">
            <label><input type="checkbox" data-p="agentQual" data-v="相關科系畢"${(d.agentQual || []).includes("相關科系畢") ? " checked" : ""}${ro ? " disabled" : ""}>相關科系畢</label>
            <label><input type="checkbox" data-p="agentQual" data-v="保母證號"${(d.agentQual || []).includes("保母證號") ? " checked" : ""}${ro ? " disabled" : ""}>保母證號</label>
          </div>
        </div>
      </div>
    </div>`;

  const kids = c.kids.map((kid) => {
    const kd = (d.kids && d.kids[kid.id]) || {};
    return `<div class="sec kid"><h2>幼兒 ${esc(kid.id)} 交接事項</h2><div class="grid">
      ${KID_FIELDS.map((f) => {
        const p = `kids.${kid.id}.${f.k}`;
        const cls = f.t === "area" || f.t === "checks" || f.t === "radio" ? "full" : "";
        return `<div class="${cls}"><div class="lbl">${esc(f.l)}</div>${inputHTML(p, f, kd[f.k], ro)}</div>`;
      }).join("")}
    </div></div>`;
  }).join("");

  const tail = `
    <div class="sec">
      <h2>其他交接事項</h2>
      <div class="lbl">代理人代班事後交接</div>
      ${inputHTML("afterNote", { t: "area" }, d.afterNote, ro)}
      <div class="lbl" style="margin-top:10px">其他需交接事項</div>
      ${inputHTML("generalNote", { t: "area" }, d.generalNote, ro)}
    </div>
    <div class="sec">
      <h2>簽名</h2>
      <div class="sigs">
        <div><div class="lbl">代理人簽名</div><canvas class="sig" data-sig="sigAgent" width="480" height="200"></canvas></div>
        <div><div class="lbl">主任簽名</div><canvas class="sig" data-sig="sigChief" width="480" height="200"></canvas></div>
      </div>
      ${ro ? "" : `<p class="lbl" style="margin-top:8px">請直接在方框內簽名（手機可用手指）</p>`}
    </div>`;

  $("form").innerHTML = basic + kids + tail;
  $("form").classList.toggle("ro", ro);

  document.querySelectorAll("canvas[data-sig]").forEach((cv) => initSig(cv, d[cv.dataset.sig], ro));

  $("stateTag").innerHTML = EDIT.id === null
    ? `<span class="tag new">新假單</span>`
    : `${statusTag(d)}`;
  $("roNote").hidden = !ro;
  $("roNote").textContent = IS_MGR ? "" : (d.status === "已送出" ? "此假單已送出，目前為唯讀。" : "");
  $("btnDraft").hidden = ro;
  $("btnSubmit").hidden = ro;
  $("btnReviewed").hidden = !(IS_MGR && EDIT.id);
  $("btnReviewed").textContent = d.reviewed ? "取消已閱" : "標示已閱";
}

function initSig(cv, existing, ro) {
  const ctx = cv.getContext("2d");
  ctx.lineWidth = 3; ctx.lineCap = "round"; ctx.strokeStyle = "#2b3a4a";
  if (existing) {
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, cv.width, cv.height);
    img.src = existing;
  }
  if (ro) { cv.style.pointerEvents = "none"; return; }
  let drawing = false;
  const pos = (e) => {
    const r = cv.getBoundingClientRect();
    return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height];
  };
  cv.addEventListener("pointerdown", (e) => {
    drawing = true; cv.setPointerCapture(e.pointerId);
    const [x, y] = pos(e); ctx.beginPath(); ctx.moveTo(x, y);
    cv.dataset.dirty = "1";
  });
  cv.addEventListener("pointermove", (e) => {
    if (!drawing) return;
    const [x, y] = pos(e); ctx.lineTo(x, y); ctx.stroke();
  });
  ["pointerup", "pointercancel"].forEach((ev) => cv.addEventListener(ev, () => { drawing = false; }));
}

// 收集表單內容（只有可編輯時才會用到）
function collect() {
  const out = {};
  const form = $("form");
  form.querySelectorAll("[data-p]").forEach((el) => {
    const p = el.dataset.p;
    if (el.type === "checkbox") {
      if (!Array.isArray(getPath(out, p))) setPath(out, p, []);
      if (el.checked) getPath(out, p).push(el.dataset.v);
    } else if (el.type === "radio") {
      if (getPath(out, p) === undefined) setPath(out, p, "");
      if (el.checked) setPath(out, p, el.value);
    } else {
      setPath(out, p, el.value);
    }
  });
  form.querySelectorAll("canvas[data-sig]").forEach((cv) => {
    const key = cv.dataset.sig;
    out[key] = cv.dataset.dirty === "1" ? cv.toDataURL("image/png") : (EDIT.data[key] || "");
  });
  return out;
}

async function save(status) {
  const fields = collect();
  const now = new Date().toISOString();
  const data = {
    ...EDIT.data, ...fields,
    owner: EDIT.data.owner || ME.email,            // 建立者不會被改掉
    reviewed: EDIT.data.reviewed || false,         // 只能由管理者標示已閱
    status,
    updatedAt: now,
    createdAt: EDIT.data.createdAt || now
  };
  if (status === "已送出") data.submittedAt = now;
  if (EDIT.id === null) {
    const ref = await SF.add("leaves", data);
    if (!ref) return;
    EDIT.id = ref.id;
  } else {
    await SF.set("leaves", EDIT.id, data);
  }
  EDIT.data = data;
  renderForm();
  alert(status === "已送出" ? "已送出" : "已儲存草稿");
}

async function toggleReviewed() {
  if (!EDIT.id) return;
  const fields = collect();
  const data = { ...EDIT.data, ...fields, reviewed: !EDIT.data.reviewed, updatedAt: new Date().toISOString() };
  await SF.set("leaves", EDIT.id, data);
  EDIT.data = data;
  renderForm();
}

<script type="module">
// 初晴之森共用雲端層：Google 登入 + 成員名單權限 + Firestore 資料
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect,
  onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {
  getFirestore, collection, doc, getDoc, getDocs, addDoc, setDoc, deleteDoc, onSnapshot, query, where
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyCar-w8B5h769FfIczVbQeQTosws9kyR8A",
  authDomain: "sunny-forest.firebaseapp.com",
  projectId: "sunny-forest",
  storageBucket: "sunny-forest.firebasestorage.app",
  messagingSenderId: "981586744223",
  appId: "1:981586744223:web:97e0ddd869f1e36e1123aa"
});
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: "select_account" });

let started = false;

function panel() {
  let el = document.getElementById("sf-gate");
  if (!el) {
    el = document.createElement("div");
    el.id = "sf-gate";
    el.style.cssText = "position:fixed;inset:0;z-index:99999;background:#fbf6ef;color:#4d4a47;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;font:16px/1.7 'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif";
    document.body.appendChild(el);

}
function hidePanel() {

}
function line(text, strong) {

function button(text, fn) {

  b.textContent = text;
  b.style.cssText = "margin-top:18px;border:0;border-radius:999px;padding:12px 26px;font:inherit;font-size:16px;background:#86ab98;color:#fff;cursor:pointer";
  b.onclick = fn;
  return b;
}
async function login() {
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    if (e.code === "auth/popup-closed-by-user" || e.code === "auth/cancelled-popup-request") return;
    if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") {
      return signInWithRedirect(auth, provider);
    }
    alert("登入失敗：" + (e.message || e.code));
  }
}
function showLogin() {
  const el = panel();
  el.append(
    line((document.title.split("｜")[0] || "初晴之森"), true),
    line("請使用 Google 帳號登入。"),

  );
}
function showDenied(email) {
  const el = panel();
  el.append(
    line("尚未開通使用權限", true),
    line("帳號 " + (email || "（無）") + " 不在成員名單內。"),

  );
}

// 只有名單內（members 集合裡有該信箱）的人才會進入頁面
function gate(onAllowed) {
  onAuthStateChanged(auth, async (user) => {
    if (!user) return showLogin();
    const email = (user.email || "").toLowerCase();
    let role = null;
    try {
      const m = await getDoc(doc(db, "members", email));
      if (m.exists()) role = m.data().role || "staff";
    } catch (e) {
      role = null;
    }
    if (!role) return showDenied(email);
    hidePanel();
    if (!started) {
      started = true;
      onAllowed({ email, role, admin: role === "admin" });
    }
  });
}

const safe = (p) => p.catch((e) => {
  console.error(e);
  alert("儲存失敗，請確認網路連線，或聯絡管理者確認您的權限");
});
const onErr = (e) => console.error(e);

const SF = {
  gate,
  watch(name, cb) {
    return onSnapshot(collection(db, name),
      (snap) => cb(snap.docs.map((d) => ({ id: d.id, ...d.data() })), snap.metadata.hasPendingWrites),
      onErr);
  },
  watchDoc(name, id, cb) {
    return onSnapshot(doc(db, name, id),
      (snap) => cb(snap.exists() ? snap.data() : null, snap.metadata.hasPendingWrites),
      onErr);
  },
  // 依欄位值篩選（例如只看自己的假單）；Firestore 規則也會限制可讀範圍
  watchWhere(name, field, value, cb) {
    return onSnapshot(query(collection(db, name), where(field, "==", value)),
      (snap) => cb(snap.docs.map((d) => ({ id: d.id, ...d.data() })), snap.metadata.hasPendingWrites),
      onErr);
  },
  add: (name, data) => safe(addDoc(collection(db, name), data)),
  addStrict: (name, data) => addDoc(collection(db, name), data),
  set: (name, id, data) => safe(setDoc(doc(db, name, id), data)),
  remove: (name, id) => safe(deleteDoc(doc(db, name, id))),
  logout: () => signOut(auth)
};

// ===== 主網站用：與 localStorage 相同的介面，資料實際存在雲端 =====
const CHUNK = 250000;   // 每段字數上限，確保單一文件不超過 Firestore 的 1MB
const cache = {};       // key -> 字串（同步讀取用）
const nChunks = {};     // key -> 目前存成幾段
let queue = Promise.resolve();
const enqueue = (fn) => { queue = queue.then(fn).catch((e) => console.error(e)); return queue; };

function splitChunks(s) {
  const out = [];
  let i = 0;
  while (i < s.length) {
    let end = Math.min(i + CHUNK, s.length);
    const code = s.charCodeAt(end - 1);
    if (end < s.length && code >= 0xD800 && code <= 0xDBFF) end -= 1; // 不切斷中間的字元
    out.push(s.slice(i, end));
    i = end;
  }
  return out.length ? out : [""];
}

async function persist(key) {
  const enc = encodeURIComponent(key);
  const old = nChunks[key] || 0;
  if (!Object.prototype.hasOwnProperty.call(cache, key)) {
    for (let i = 0; i < old; i++) await deleteDoc(doc(db, "kv", enc + "#" + i));
    await deleteDoc(doc(db, "kv", enc));
    delete nChunks[key];
    return;
  }
  const parts = splitChunks(cache[key]);
  for (let i = 0; i < parts.length; i++) await setDoc(doc(db, "kv", enc + "#" + i), { d: parts[i] });
  await setDoc(doc(db, "kv", enc), { n: parts.length });
  for (let i = parts.length; i < old; i++) await deleteDoc(doc(db, "kv", enc + "#" + i));
  nChunks[key] = parts.length;
}

async function preload() {
  const snap = await getDocs(collection(db, "kv"));
  const meta = {}, parts = {};
  snap.forEach((d) => {
    const id = d.id, data = d.data();
    const h = id.lastIndexOf("#");
    if (h < 0) meta[id] = data.n || 0;
    else {
      const enc = id.slice(0, h), i = +id.slice(h + 1);
      (parts[enc] = parts[enc] || [])[i] = data.d || "";
    }
  });
  Object.keys(meta).forEach((enc) => {
    const key = decodeURIComponent(enc), arr = parts[enc] || [];
    let s = "";
    for (let i = 0; i < meta[enc]; i++) s += arr[i] || "";
    cache[key] = s;
    nChunks[key] = meta[enc];
  });
}

const KV = {
  getItem(k) { return Object.prototype.hasOwnProperty.call(cache, k) ? cache[k] : null; },
  setItem(k, v) { cache[k] = String(v); enqueue(() => persist(k)); },
  removeItem(k) { delete cache[k]; enqueue(() => persist(k)); }
};

// 找出這台裝置上的舊資料：
// pending＝雲端沒有、只存在這台裝置；conflicts＝雲端與這台裝置內容不同（需要你決定）
function offerMigration() {
  const pending = [], conflicts = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k || k.startsWith("adm:") || k.startsWith("bak:")) continue;
      const local = localStorage.getItem(k) || "";
      if (!Object.prototype.hasOwnProperty.call(cache, k)) pending.push(k);
      else if (cache[k] !== local) conflicts.push(k);
    }
  } catch (e) { return; }
  if (!pending.length && !conflicts.length) return;

  const stamp = () => new Date().toISOString().replace(/[:.]/g, "-");
  const btnStyle = "margin-left:8px;border:0;border-radius:999px;padding:4px 14px;font:inherit;background:#86ab98;color:#fff;cursor:pointer";
  const bar = document.createElement("div");
  bar.style.cssText = "position:fixed;left:0;right:0;top:0;z-index:99998;background:#fff3c4;color:#4d4a47;padding:8px 12px;text-align:center;font:14px/1.6 'Noto Sans TC','PingFang TC',sans-serif;box-shadow:0 2px 6px rgba(0,0,0,.15)";
  const mk = (label, fn) => {
    const b = document.createElement("button");
    b.textContent = label; b.style.cssText = btnStyle;
    b.onclick = () => fn(b);
    return b;
  };

  const parts = [];
  if (pending.length) parts.push("這台裝置有尚未上傳的舊資料");
  if (conflicts.length) parts.push("有 " + conflicts.length + " 項與雲端內容不同");
  const txt = document.createElement("span");
  txt.textContent = parts.join("；") + "。";
  const nodes = [txt];

  if (pending.length) {
    nodes.push(mk("上傳到雲端", async (b) => {
      b.disabled = true; b.textContent = "上傳中…";
      try {
        for (const k of pending) {
          cache[k] = localStorage.getItem(k) || "";
          await persist(k);
        }
        bar.remove();
        alert("舊資料已上傳到雲端");
      } catch (e) {
        console.error(e);
        alert("上傳失敗，請確認網路後再試一次");
        b.disabled = false; b.textContent = "上傳到雲端";
      }
    }));
  }

  if (conflicts.length) {
    nodes.push(mk("處理差異", async (b) => {
      b.disabled = true; b.textContent = "處理中…";
      try {
        for (const k of conflicts) {
          const local = localStorage.getItem(k) || "";
          const cloudVal = cache[k];
          const useLocal = confirm(
            "「" + k + "」雲端與這台裝置的內容不同。\n\n" +
            "確定：改用這台裝置的版本（雲端原版本會備份到雲端）\n" +
            "取消：保留雲端版本（這台裝置的版本會備份到雲端）"
          );
          // 兩邊都先備份到雲端，確保不會因為選擇而遺失內容
          KV.setItem("bak:" + k + ":" + stamp(), useLocal ? cloudVal : local);
          if (useLocal) KV.setItem(k, local);
        }
        await queue;
        bar.remove();
        alert("差異已處理完成");
      } catch (e) {
        console.error(e);
        alert("處理失敗，請確認網路後再試一次");
        b.disabled = false; b.textContent = "處理差異";
      }
    }));
  }

  nodes.push(mk("稍後", () => bar.remove()));
  bar.append(...nodes);
  document.body.appendChild(bar);
}

// 主網站各頁入口：先登入與權限檢查 → 載入雲端資料 → 才執行頁面程式
function startApp() {
  gate(async () => {
    try {
      await preload();
    } catch (e) {
      console.error(e);
      alert("資料載入失敗，請重新整理或確認網路");
      return;
    }
    window.KV = KV;
    offerMigration();
    document.querySelectorAll('script[type="text/plain"][data-app]').forEach((s) => {
      const el = document.createElement("script");
      el.textContent = s.textContent;
      s.replaceWith(el);
    });
  });
}

// ===== 單一檔案：共用登入 + 頁面切換（網址 #/頁面名稱?參數）=====
let USER = null;
window.__SF = { ...SF, gate: (cb) => cb(USER) };   // 已在外層登入，子頁直接放行
window.__startApp = (w) => {
  w.KV = KV;
  w.document.querySelectorAll('script[type="text/plain"][data-app]').forEach((s) => {
    const el = w.document.createElement("script");
    el.textContent = s.textContent;
    s.replaceWith(el);
  });
};
window.__go = (name, q) => { location.hash = "#/" + name + (q || ""); };

function parseHash() {
  const m = location.hash.match(/^#\/([a-z-]+)(\?.*)?$/);
  return m ? { name: m[1], q: m[2] || "" } : { name: "index", q: "" };
}

const MISSING = '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>尚未開放｜初晴之森托嬰中心</title><body style="margin:0;font:16px/1.7 sans-serif;background:#fbf6ef;color:#4d4a47;text-align:center;padding:60px 20px"><p style="font-size:20px">此頁面尚未開放</p><a href="index.html">← 回首頁</a></body>';

function show() {
  const { name, q } = parseHash();
  window.__q = q;
  const src = document.getElementById("pg-" + name);
  const html = src ? src.textContent.replace(/<\\\/script/g, "</script").replace(/<\\!--/g, "<!--") : MISSING;
  const f = document.createElement("iframe");
  f.id = "view";
  f.srcdoc = html;
  f.onload = () => wire(f);
  const old = document.getElementById("view");
  if (old) old.replaceWith(f); else document.body.appendChild(f);
  document.getElementById("boot").style.display = "none";
}

function wire(f) {
  const d = f.contentDocument;
  if (!d) return;
  if (d.title) document.title = d.title;
  d.addEventListener("click", (e) => {
    const a = e.target.closest && e.target.closest("a[href]");
    if (!a) return;
    const href = a.getAttribute("href");
    const m = href.match(/^([a-z-]+)\.html(\?[^#]*)?$/);
    if (m) { e.preventDefault(); window.__go(m[1], m[2] || ""); return; }
    if (href.length > 1 && href[0] === "#") {
      const t = d.getElementById(href.slice(1));
      if (t) { e.preventDefault(); t.scrollIntoView({ behavior: "smooth" }); }
    }
  }, true);
}

gate(async (u) => {
  USER = u;
  try { await preload(); }
  catch (e) { console.error(e); alert("資料載入失敗，請重新整理或確認網路"); return; }
  window.KV = KV;
  offerMigration();
  window.addEventListener("hashchange", show);
  show();
});
