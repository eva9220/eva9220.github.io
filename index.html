<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>初晴之森托嬰中心</title>
<style>
:root{--bg:#fdf8ee;--ink:#4d4a47;--sub:#8c857d;color-scheme:light}*{box-sizing:border-box}
body{margin:0;color:var(--ink);font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding-bottom:env(safe-area-inset-bottom,0px);overflow-x:hidden;background-color:var(--bg);background-image:radial-gradient(#e9dcc3 1.3px,transparent 1.6px);background-size:22px 22px}
.hero{position:relative;text-align:center;padding:calc(30px + env(safe-area-inset-top,0px)) 16px 30px;margin:8px 10px 0}
.blob{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.hero>*:not(.blob):not(.tape):not(.d){position:relative;z-index:1}
.hero img{width:100px;filter:drop-shadow(0 3px 0 rgba(77,74,71,.15))}
.hero h1{margin:2px 0 0;font-size:24px;letter-spacing:.06em;transform:rotate(-1.5deg);text-shadow:2px 2px 0 #fff}
.hero p{margin:2px 0 0;font-size:12px;letter-spacing:.14em;color:#6f6592}
.tape{position:absolute;z-index:2;width:78px;height:24px;opacity:.9;background:repeating-linear-gradient(45deg,#c3b2e2 0 6px,#e0d6f1 6px 12px)}
svg.d{position:absolute;z-index:1;fill:none;stroke:#4d4a47;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;filter:url(#r2)}svg.d .y{fill:#f6d77a}svg.d .w{fill:#fffdf9}
h2{text-align:center;font-size:16px;letter-spacing:.3em;color:var(--sub);margin:26px 0 18px;transform:rotate(-1deg)}
main{max-width:560px;margin:0 auto;padding:0 16px 30px}
.card{position:relative;display:flex;align-items:center;gap:14px;background:#fffdf9;border-radius:30px 36px 28px 34px/34px 28px 36px 30px;padding:16px 16px 16px 14px;margin:0 6px 22px;text-decoration:none;color:var(--ink);box-shadow:5px 6px 0 var(--k);transition:transform .15s}
.card::before{content:"";position:absolute;inset:-1px;border:2.6px solid var(--ink);border-radius:30px 36px 28px 34px/34px 28px 36px 30px;filter:url(#r2);pointer-events:none}
.card::after{content:"";position:absolute;top:-10px;left:22px;width:54px;height:20px;background:var(--k);opacity:.85;transform:rotate(-6deg);border-radius:2px}
a.card:active{transform:translate(3px,4px);box-shadow:2px 2px 0 var(--k)}
.ic{flex:none;width:66px;height:66px;border-radius:26px 20px 28px 22px;background:var(--bg2);display:flex;align-items:center;justify-content:center}
.tx{flex:1;min-width:0}.tx small{display:block;color:var(--k);font-weight:800;font-size:11px;letter-spacing:.16em;filter:brightness(.85)}.tx b{display:block;font-size:19px;line-height:1.35}.tx span{display:block;color:var(--sub);font-size:13px;line-height:1.5}
.ar{font-size:26px;color:var(--ink)}.soon{opacity:.62}.soon .bd{display:inline-block;background:#f1e6da;border-radius:999px;padding:0 10px;font-size:12px;margin-top:2px}
.note{margin:6px 6px 0;background:#fffdf9;border:2px dashed #cdbfa9;border-radius:22px;padding:12px 16px;font-size:13px;color:var(--sub)}
</style></head><body>
