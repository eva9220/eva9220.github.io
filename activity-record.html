<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>適性發展活動｜初晴之森托嬰中心</title>
<style>
:root{--ink:#222;--line:#222;--teal:#e6f1ea;--green:#86ab98;--bg:#fbf6ef}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
main{max-width:760px;margin:0 auto;padding:12px;background:#fff}
a{color:#6f9a85;font-size:14px;text-decoration:none}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 10px}
.head img{height:52px}
.head h1{font-size:22px;margin:0;font-weight:500;flex:1}
.g{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--line);margin-bottom:10px}
.g label{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--line);font-weight:700;font-size:14px}
.g .w{grid-column:1/-1}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);border:0;background:transparent;width:100%;min-width:0;outline:none}
.g input,.g select{border-bottom:1px dashed #999}
.dom{border:2px solid var(--line);margin-bottom:10px}
.dh{background:var(--teal);font-weight:800;padding:6px 10px;border-bottom:2px solid var(--line)}
.dom textarea{display:block;height:96px;padding:8px 10px;resize:vertical;border-bottom:1px solid var(--line)}
.ps{display:grid;grid-template-columns:1fr 1fr}
.ph{position:relative;aspect-ratio:4/3;border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:#888;font-size:14px;cursor:pointer;overflow:hidden}
.ph:last-child{border-right:0}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph input{display:none}
.x{position:absolute;top:4px;right:4px;z-index:2;border:0;border-radius:50%;width:26px;height:26px;background:rgba(0,0,0,.55);color:#fff;font-size:14px}
.box{border:2px solid var(--line);margin-bottom:10px}
.box textarea{display:block;height:100px;padding:8px 10px;resize:vertical}
canvas{display:block;width:100%;height:150px;touch-action:none;border-top:1px dashed #999;background:#fff}
.sg{display:flex;align-items:center;justify-content:space-between;padding:4px 10px;font-weight:700;font-size:14px}
button.b{border:1px solid #bbb;background:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-size:14px;cursor:pointer}
.bar{display:flex;gap:10px;margin:14px 0 24px}
.bar .b{flex:1;padding:10px}
.bar .p{background:var(--green);border-color:var(--green);color:#fff}
@media screen{.g label{white-space:nowrap}.g{margin-bottom:0;border-bottom:0}.dom{margin:0;border-bottom:0}.box{margin:0;border-bottom:0}#fbbox{border-bottom:2px solid var(--line)}}
.pt,.th{display:none}
@media print{
#ov{display:none!important}#tch::placeholder{color:transparent}#mth{font-size:10pt;color:#000;margin:0 0 3px}
@page{size:A4;margin:6mm}
body{background:#fff;font-size:9pt}
main{padding:0;max-width:none}
.bar,.x,a,.sg button,#note,.hn,.ph span,#hint{display:none}
.head{margin:0 0 2px;flex-wrap:nowrap}.head img{height:13mm}.head h1{font-size:18pt}
.g{grid-template-columns:repeat(4,1fr);border:2px solid #000;border-bottom:0;margin:0}
.g label{white-space:nowrap;grid-column:span 2;border:0;border-right:2px solid #000;border-bottom:2px solid #000;font-size:10pt;padding:2px 6px}
.g label:nth-child(2n){border-right:0}
.g .w{order:4;grid-column:span 2;border-right:0}
.g label:nth-child(4){order:5;grid-column:1/-1;border-right:0}
.g input,.g select{border:0;font-size:10pt;appearance:none;-webkit-appearance:none;width:auto;flex:1}
input[type=date]::-webkit-calendar-picker-indicator{display:none}
.th{display:grid;grid-template-columns:13% 36% 51%;background:#e6f1ea;border:2px solid #000;border-bottom:0;font-weight:800;text-align:center;font-size:10pt}
.th div{padding:3px;border-right:2px solid #000}.th div:last-child{border-right:0}
.dom{display:grid;grid-template-columns:13% 36% 25.5% 25.5%;border:2px solid #000;border-bottom:0;margin:0;min-height:29mm;break-inside:avoid}
.dom .dh{grid-column:1;background:#fff;border:0;border-right:2px solid #000;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10pt;padding:2px}
.dh span{display:block;font-size:8pt;margin:0!important}
.dom textarea,.box textarea{display:none}
.pt{display:block;white-space:pre-wrap}
.dom .pt{grid-column:2;border-right:2px solid #000;padding:3px 5px;font-size:8pt;line-height:1.35}
.dom .ps{display:contents}
.ph{border:0;border-right:2px solid #000;aspect-ratio:auto;min-height:29mm;cursor:default}
.ph:last-child{border-right:0}
.box{display:grid;grid-template-columns:13% 1fr;border:2px solid #000;border-bottom:0;margin:0;break-inside:avoid}
#fbbox{border-bottom:2px solid #000}
.box .dh{grid-column:1;grid-row:1/span 3;background:#fff;border:0;border-right:2px solid #000;display:flex;align-items:center;justify-content:center;font-size:10pt}
.box .pt{grid-column:2;min-height:15mm;padding:3px 6px;font-size:9pt}
.box .sg{grid-column:2;padding:0 6px 3mm;justify-content:flex-start;align-items:flex-end;min-height:20mm;font-size:10pt}
}
#mth{font-size:14px;color:#6f9a85;font-weight:700;margin:0 0 8px}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:9}
#sh{position:absolute;left:0;right:0;bottom:0;max-height:80%;overflow:auto;background:#fbf6ef;border-radius:22px 22px 0 0;padding:16px 14px calc(22px + env(safe-area-inset-bottom,0px))}
.sh-h{display:flex;align-items:center;gap:8px;margin-bottom:10px}.sh-h b{flex:1;font-size:17px}
.srow{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.srow .row{flex:1;text-align:left;border:1.5px solid #ddd;background:#fff;border-radius:16px;padding:10px 14px;font:inherit;font-size:15px;cursor:pointer}
.srow .row.on{background:#9dbfae;border-color:#9dbfae;color:#fff}
.del{border:0;background:none;color:#999;font-size:16px;padding:6px 8px;cursor:pointer}
#nn{border:1.5px dashed #9dbfae;border-radius:16px;padding:10px 14px;background:#fff}
#tch{cursor:pointer}
</style>
</head>
